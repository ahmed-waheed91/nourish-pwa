    --surface: #F8F8F6;
    --card: #FFFFFF;
    --border: rgba(11,11,11,0.09);
    --brand: #1C5C4B;
    --brand-dark: #123F34;
    --brand-tint: #E4EFEA;
    --good: #0ca30c;      --good-tint: #E7F6E4;
    --warning: #B9790A;   --warning-tint: #FDF0D9;
    --critical: #d03b3b;  --critical-tint: #FBE7E5;
    --protein: #2a78d6;
    --carbs: #eb6834;
    --fat: #1baf7a;
    --usda: #2a78d6;      --usda-tint: #E6F0FB;
    --lab-tint: #EEEEEC;  --lab-c: #5B615F;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

    background: var(--studio-bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(18,63,52,0.07) 1px, transparent 0);

    color: var(--ink);

  .disp{ font-family:'Manrope', system-ui, sans-serif; }

    display:flex; align-items:baseline; justify-content:space-between; gap:16px;

  .studio-title{
    display:flex; align-items:center; gap:12px;
  }
  .studio-mark{
    width:38px; height:38px; border-radius:11px; background:var(--brand); color:#fff;

  .studio-sub{ font-size:13px; color:var(--ink-2); margin-top:1px; }

    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 2px 10px rgba(18,63,52,0.05);
    margin-bottom: 30px;
  }
  .seg{ display:flex; gap:4px; background: var(--surface); border-radius: 10px; padding:4px; }
  .seg-btn{
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;

  .tab-btn{

function mealKcal(meal){ return Math.round(meal.items.reduce((a,it)=>a+it.kcal,0)*10)/10; }
function computeConsumedTotals(meals){
  const t = { calories:0, protein:0, carbs:0, fat:0, fiber:0, sugar:0, sodium:0 };
  meals.forEach(meal => meal.items.forEach(it => {
    t.calories += it.kcal; t.protein += it.p; t.carbs += it.c; t.fat += it.f; t.fiber += it.fib;
    t.sugar += it.sugar||0; t.sodium += it.sodium||0;
  }));
  const round1 = n => Math.round(n*10)/10;
  return { calories:Math.round(t.calories), protein:round1(t.protein), carbs:round1(t.carbs), fat:round1(t.fat), fiber:round1(t.fiber), sugar:round1(t.sugar), sodium:Math.round(t.sodium) };
}

/* ---------- Composite Saved Foods (multi-component, per-100g scalable "meals") ---------- */
function isComponentLive(comp){
  if (!comp.refId) return false;
  const list = App.state.memory[comp.refKind] || [];
  return list.some(x => x.id === comp.refId);
}
function resolveComponentPer100(comp){
  if (comp.refId){
    const list = App.state.memory[comp.refKind] || [];
    const live = list.find(x => x.id === comp.refId);
    if (live){
      const fresh = { kcal:live.kcalPer100, p:live.p, c:live.c, f:live.f, fib:live.fib, sugar:live.sugar, sodium:live.sodium };
      // keep the frozen fallback (name, unit, values) fresh for as long as the link resolves
      comp.per100 = fresh; comp.name = live.name; comp.unit = live.unit || comp.unit;
      return fresh;
    }
  }
  return comp.per100;
}
function computeComponentScaled(comp){
  const per100 = resolveComponentPer100(comp);
  const scale = (comp.weight||0)/100;
  const round1 = n => Math.round(n*scale*10)/10;
  return {
    name: comp.name, weight: comp.weight, unit: comp.unit||'g',
    kcal: Math.round((per100.kcal||0)*scale), p:round1(per100.p||0), c:round1(per100.c||0), f:round1(per100.f||0),
    fib:round1(per100.fib||0), sugar:round1(per100.sugar||0), sodium:Math.round((per100.sodium||0)*scale),
  };
}
function computeCompositeTotal(food){
  const scaledList = (food.components||[]).map(computeComponentScaled);
  const total = scaledList.reduce((acc,c) => ({
    kcal:acc.kcal+c.kcal, p:acc.p+c.p, c:acc.c+c.c, f:acc.f+c.f, fib:acc.fib+c.fib, sugar:acc.sugar+c.sugar, sodium:acc.sodium+c.sodium,
  }), {kcal:0,p:0,c:0,f:0,fib:0,sugar:0,sodium:0});
  return { scaledList, total };
}
function refreshCompositeFoodTotals(){
  const round1 = n => Math.round(n*10)/10;
  (App.state.memory.foods||[]).forEach(food => {
    if (!Array.isArray(food.components)) return;
    const { total } = computeCompositeTotal(food);
    food.kcal = Math.round(total.kcal); food.p = round1(total.p); food.c = round1(total.c); food.f = round1(total.f);
    food.fib = round1(total.fib); food.sugar = round1(total.sugar); food.sodium = Math.round(total.sodium);
  });
}

/* ---------- Real OCR for label photos (Tesseract.js, fully vendored/offline) ---------- */
function vendorUrl(rel){ return new URL(rel, document.baseURI).href; }
async function runLabelOcr(imageDataUrl){
  const worker = await Tesseract.createWorker('eng', Tesseract.OEM.LSTM_ONLY, {
    workerPath: vendorUrl('vendor/tesseract/worker.min.js'),
    corePath: vendorUrl('vendor/tesseract'),
    langPath: vendorUrl('vendor/tesseract'),
  });
  try {
    const { data } = await worker.recognize(imageDataUrl);
    return data.text || '';
  } finally {
    await worker.terminate();
  }
}
function parseNutritionLabelText(text){
  const joined = text.replace(/\r/g, '');
  const patterns = [
    ['kcal', /calories\D{0,10}(\d+(?:\.\d+)?)/i],
    ['p', /protein\D{0,10}(\d+(?:\.\d+)?)/i],
    ['c', /(?:total\s+)?carbohydrate\D{0,10}(\d+(?:\.\d+)?)/i],
    ['f', /(?:total\s+)?fat\D{0,10}(\d+(?:\.\d+)?)/i],
    ['fib', /(?:dietary\s+)?fiber\D{0,10}(\d+(?:\.\d+)?)/i],
    ['sugar', /sugars?\D{0,10}(\d+(?:\.\d+)?)/i],
    ['sodium', /sodium\D{0,10}(\d+(?:\.\d+)?)/i],
  ];
  const result = {};
  patterns.forEach(([key, re]) => {
    const m = joined.match(re);
    if (m) result[key] = parseFloat(m[1]);
  });
  return result;
}

function makeId(name){
  return (name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'item') + '_' + Math.random().toString(36).slice(2,6);
}

function mergeCommonFoodsIntoUsda(usdaList){
  const baseName = n => n.toLowerCase().split(',')[0].trim();
  COMMON_FOODS.forEach(food => {
    const exists = usdaList.some(u => baseName(u.name) === baseName(food.name));
    if (exists) return;
    const per = food.per100;
    usdaList.push({
      id: makeId(food.name), name: food.name, fdc:'USDA · common food', unit:'g', pieceG: food.pieceG || null,
      kcal: per.kcal, kcalPer100: per.kcal, p: per.p, c: per.c, f: per.f, fib: per.fib, sugar: per.sugar, sodium: per.sodium,
    });
  });
  return usdaList;
}

function parseQuantity(raw){
  const q = (raw||'').trim().toLowerCase();
  if (!q) return null;
  const m = q.match(/^(\d+(?:\.\d+)?)\s*(g|gram|grams|ml|milliliter|milliliters)?\s+(.+)$/);
  let grams=null, count=null, name;
  if (m){
    const num = parseFloat(m[1]);
    if (m[2]) grams = num; else count = num;
    name = m[3].trim();
  } else {
    name = q; count = 1;
  }
  return { grams, count, name, nameNorm: name.replace(/e?s$/,''), unitIsMl: !!(m && m[2] && m[2][0]==='m') };
}
function computeFromPer100(per100, name, parsed, pieceG){
  const { grams, count, unitIsMl } = parsed;
  let usedGrams, basis;
  if (grams != null){ usedGrams = grams; basis = `${grams}${unitIsMl ? 'ml' : 'g'}`; }
  else {
    const pg = pieceG || 100;
    usedGrams = count * pg;
    basis = pieceG ? `${count} × ~${pg}g` : `${count} × 100g (no standard piece size)`;
  }
  const scale = usedGrams/100;
  const round1 = n => Math.round(n*scale*10)/10;
  return {
    notFound:false, name, grams:usedGrams, basis, per100,
    kcal:Math.round(per100.kcal*scale), p:round1(per100.p), c:round1(per100.c), f:round1(per100.f),
    fib:round1(per100.fib), sugar:round1(per100.sugar), sodium:Math.round(per100.sodium*scale),
  };
}
function findLocalFood(name, nameNorm){
  const usda = App.state.memory.usda;
  const saved = usda.find(u => u.name.toLowerCase() === name)
    || usda.find(u => u.name.toLowerCase().split(',')[0] === nameNorm)
    || usda.find(u => u.name.toLowerCase().includes(nameNorm) || nameNorm.includes(u.name.toLowerCase().split(',')[0]));
  if (!saved) return null;
  return {
    name: saved.name,
    per100: { kcal:saved.kcalPer100, p:saved.p, c:saved.c, f:saved.f, fib:saved.fib, sugar:saved.sugar, sodium:saved.sodium },
    pieceG: saved.pieceG || null, alreadySaved:true,
  };
}

/* ---------- Live USDA FoodData Central lookup ---------- */
/* API key lives only in this device's localStorage (Settings screen) — never hardcoded/committed. */
const USDA_NUTRIENT_IDS = { p:1003, c:1005, f:1004, fib:1079, sugar:2000, sodium:1093 };
const USDA_KCAL_IDS = [1008, 2047, 2048]; // Energy; Foundation-tier foods use the Atwater-factor ids instead of 1008
const USDA_DATA_TYPE_TIERS = ['Foundation', 'SR Legacy', 'Survey (FNDDS)', 'Branded'];
async function fetchUsdaFood(name, apiKey){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    let food = null;
    for (const tier of USDA_DATA_TYPE_TIERS){
      const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(apiKey)}&query=${encodeURIComponent(name)}&pageSize=3&dataType=${encodeURIComponent(tier)}`;
      const res = await fetch(url, { signal: controller.signal });
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      if (data.foods && data.foods.length){ food = data.foods[0]; break; }
    }
    if (!food) return { notFound:true };
    const per100 = { kcal:0, p:0, c:0, f:0, fib:0, sugar:0, sodium:0 };
    const kcalById = {};
    (food.foodNutrients||[]).forEach(n => {
      Object.keys(USDA_NUTRIENT_IDS).forEach(key => { if (n.nutrientId === USDA_NUTRIENT_IDS[key]) per100[key] = n.value || 0; });
      if (USDA_KCAL_IDS.includes(n.nutrientId)) kcalById[n.nutrientId] = n.value || 0;
    });
    const kcalId = USDA_KCAL_IDS.find(id => kcalById[id] != null);
    per100.kcal = kcalId != null ? kcalById[kcalId] : 0;
    return { notFound:false, name:food.description, per100, fdcId:food.fdcId };
  } catch (e){
    return { noConnection:true };
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- Real dates & liters formatting ---------- */
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateFromISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatFullDate(iso){
  const d = dateFromISO(iso);
  return `${WEEKDAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function formatShortDate(iso){
  const d = dateFromISO(iso);
  return `${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}`;
}
function formatLiters(ml){
  const l = Math.round((ml/1000)*100)/100;
  return String(l);
}
function saveFileToDevice(filename, text){
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function defaultTargets(){
  return {
    calories: { kind:'ceiling', value:1900, unit:'kcal' },
    protein: { kind:'range', low:135, high:155, unit:'g' },
    carbs: { kind:'range', low:150, high:190, unit:'g' },
    fat: { kind:'range', low:50, high:70, unit:'g' },
    fiber: { kind:'floor', value:30, unit:'g' },
    sugar: { kind:'ceiling', value:50, unit:'g' },
    sodium: { kind:'ceiling', value:2300, unit:'mg' },
    water: { kind:'range', low:2.5, high:3, unit:'L' },
    weight: { kind:'range', low:78, high:82, unit:'kg' },
  };
}
function targetInfo(id){
  const t = App.state.targets[id];
  if (t.kind === 'range') return { label:`${t.low.toLocaleString()}–${t.high.toLocaleString()} ${t.unit}`, low:t.low, high:t.high, unit:t.unit };
  if (t.kind === 'ceiling') return { label:`Under ${t.value.toLocaleString()} ${t.unit}`, high:t.value, unit:t.unit };
  return { label:`≥ ${t.value.toLocaleString()} ${t.unit}`, low:t.value, unit:t.unit };
}
function statusFor(id, value){
  const t = App.state.targets[id];
  if (t.kind === 'ceiling') return value <= t.value ? 'good' : 'critical';
  if (t.kind === 'floor') return value >= t.value ? 'good' : 'warning';
  if (value < t.low) return 'warning';
  if (value > t.high) return 'critical';
  return 'good';
}
function statusLabelFor(id, value){
  const s = statusFor(id, value);
  if (s === 'good') return 'In range';
  return s === 'warning' ? 'Under' : 'Over';
}
function detailFor(id, value){
  const t = App.state.targets[id];
  const info = targetInfo(id);
  const round1 = n => Math.round(n*10)/10;
  if (t.kind === 'range'){
    if (value < t.low) return `${round1(t.low-value)} ${info.unit} under target.`;
    if (value > t.high) return `${round1(value-t.high)} ${info.unit} over target.`;
    return `Within the ${info.label} range.`;
  }
  if (t.kind === 'ceiling'){
    return value <= t.value ? `Comfortably under the ${t.value}${info.unit} ceiling.` : `${round1(value-t.value)} ${info.unit} over the ceiling.`;
  }
  return value >= t.value ? `At or above the ≥${t.value}${info.unit} floor.` : `${round1(t.value-value)} ${info.unit} under the floor.`;
}

    const local = findLocalFood(parsed.name, parsed.nameNorm);
    if (local){
      st.lookupResult = { ...computeFromPer100(local.per100, local.name, parsed, local.pieceG), source:'local', alreadySaved:local.alreadySaved };
      st.lookupLoading = false;
      this.render();

    if (!this.state.usdaApiKey){
      st.lookupResult = { missingKey:true, query:raw };
      st.lookupLoading = false;
      this.render();

    }

    st.lookupLoading = true;
    st.lookupResult = null;
    this.render();
    const apiRes = await fetchUsdaFood(parsed.name, this.state.usdaApiKey);
    if (st.lookupQuery !== raw) return; // query changed while waiting on the network
    st.lookupLoading = false;
    if (apiRes.noConnection){
      st.lookupResult = { noConnection:true, query:raw };
    } else if (apiRes.notFound){
      st.lookupResult = { notFound:true, query:raw };
    } else {
      st.lookupResult = { ...computeFromPer100(apiRes.per100, apiRes.name, parsed, null), source:'api', fdcId:apiRes.fdcId };

          ...f, ocrRunning:false, scanned:found, ocrFailed:!found,
          kcal: parsed.kcal ?? f.kcal, p: parsed.p ?? f.p, c: parsed.c ?? f.c, f: parsed.f ?? f.f,
          fib: parsed.fib ?? f.fib, sugar: parsed.sugar ?? f.sugar, sodium: parsed.sodium ?? f.sodium,
        };

  scaleComposedComponent(foodId, componentId, inputEl){

      total += (cPer100.kcal||0)*cw/100;

  addComposedFoodToMeal(foodId){

      const w = parseFloat(document.getElementById(`cf-weight-${foodId}-${comp.id}`)?.value) || comp.weight || 0;

      meal.items.push({
        name: `${comp.name}, ${w}${comp.unit||'g'}`,
        kcal: Math.round((per100.kcal||0)*scale), p:round1(per100.p||0), c:round1(per100.c||0), f:round1(per100.f||0),
        fib:round1(per100.fib||0), sugar:round1(per100.sugar||0), sodium:Math.round((per100.sodium||0)*scale),

    });

    this.state.addfood.expandedSavedId = null;

    const idx = fromList.findIndex(x => x.id === id);
    if (idx === -1) return;
    const item = fromList[idx];
    const shared = { name:item.name, kcal:item.kcal, p:item.p, c:item.c, f:item.f, fib:item.fib, sugar:item.sugar, sodium:item.sodium, photo:item.photo||null };
    const toList = this.state.memory[toKind];
    let moved = toKind === 'ingredients'
      ? { ...shared, id:item.id, unit:item.unit||'g', source:'Per label', kcalPer100:item.kcal }
      : { ...shared, id:item.id, recipe:item.recipe || `Moved from Ingredients — ${item.kcal} kcal per 100${item.unit||'g'}.`, updated:'Just now' };
    if (toList.some(x => x.id === moved.id)) moved.id = this.genId(moved.name);
    fromList.splice(idx, 1);
    toList.push(moved);
    if (this.state.library.openId === id) this.state.library.openId = null;

  exportPdf(){
    const st = this.state.exportScreen;
    if (!window.jspdf || !window.jspdf.jsPDF){
      st.dataStatus = "Couldn't load the PDF engine — try reopening the app and try again.";
      this.render();
      return;
    }
    const realDays = this.allRealDays();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 16;
    const contentW = pageW - margin*2;
    const brand=[28,92,75], brandDark=[18,63,52], ink=[20,24,26], ink2=[91,97,95], muted=[139,144,141];
    const good=[12,163,12], warning=[185,121,10], critical=[208,59,59];
    const protein=[42,120,214], carbs=[235,104,52], fat=[27,175,122], border=[225,225,222];
    const ensureRoom = (y, needed) => { if (y + needed > pageH - 16){ doc.addPage(); return 20; } return y; };
    const statusColorFor = s => s==='good' ? good : (s==='warning' ? warning : critical);
    const statusTextFor = s => s==='good' ? 'OK' : (s==='warning' ? 'LOW' : 'HIGH');

    let filename, exportLabel;

    if (st.mode === 'day'){
      const entry = realDays[st.offset];
      if (!entry){ st.dataStatus = 'Nothing logged for this day — nothing to export.'; this.render(); return; }
      const dateLabel = entry.isToday ? formatFullDate(this.state.dayLog.currentDate) : formatFullDate(entry.date);
      exportLabel = entry.isToday ? 'Today' : formatShortDate(entry.date);
      const gold=[212,161,61], terracotta=[181,86,61], navy=[58,71,80], brandTint=[228,239,234];

      // Header — plain white background, centered black title, left date, green rule
      doc.setTextColor(...ink);
      doc.setFont('helvetica','bold'); doc.setFontSize(20);
      doc.text('Daily Nutrition Report', pageW/2, 20, { align:'center' });
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(...ink2);
      doc.text(dateLabel, margin, 30);
      doc.setDrawColor(...brand); doc.setLineWidth(0.6);
      doc.line(margin, 35, pageW-margin, 35);
      doc.setLineWidth(0.1);

      let y = 45;
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...brand);
      doc.text('Daily Summary', margin, y);
      y += 4;

      const summaryDefs = [
        ['Calories', 'calories', entry.calories, `${Math.round(entry.calories)} kcal`],
        ['Protein', 'protein', entry.protein, `${entry.protein} g`],
        ['Carbs', 'carbs', entry.carbs, `${entry.carbs} g`],
        ['Fat', 'fat', entry.fat, `${entry.fat} g`],
        ['Fiber', 'fiber', entry.fiber, `${entry.fiber} g`],
        ['Sugar', 'sugar', entry.sugar, `${entry.sugar} g`],
        ['Sodium', 'sodium', entry.sodium, `${entry.sodium} mg`],
        ['Water', 'water', entry.waterMl/1000, `${formatLiters(entry.waterMl)} L`],
      ];
      const statusList = summaryDefs.map(([,id,value]) => statusFor(id, value));
      const summaryRows = summaryDefs.map(([label,id,value,consumedStr], i) => [
        label, consumedStr, pdfTargetRangeLabel(id), pdfDetailLabel(id, value), pdfStatusLabel(statusList[i]),
      ]);

      doc.autoTable({
        startY: y,
        margin: { left: margin, right: margin },
        head: [['', 'Consumed', 'Target Range', 'Detail', 'Status']],
        body: summaryRows,
        theme: 'grid',
        styles: { font:'helvetica', fontSize:9, cellPadding:3, textColor: ink, lineColor: border, lineWidth:0.15, halign:'center' },
        headStyles: { fillColor: brand, textColor:[255,255,255], fontStyle:'bold', halign:'center' },
        columnStyles: { 0: { halign:'left', fontStyle:'bold' } },
        didParseCell: (data) => {
          if (data.section === 'body' && data.column.index === 4){
            data.cell.styles.textColor = statusColorFor(statusList[data.row.index]);
            data.cell.styles.fontStyle = 'bold';
          }
        },
      });
      y = doc.lastAutoTable.finalY + 8;

      // Macro split bar — green/gold/terracotta, labels below each segment
      const macroCals = { protein: entry.protein*4, carbs: entry.carbs*4, fat: entry.fat*9 };
      const macroTotal = Math.max(1, macroCals.protein+macroCals.carbs+macroCals.fat);
      const pPct = Math.round(macroCals.protein/macroTotal*100), cPct = Math.round(macroCals.carbs/macroTotal*100), fPct = Math.round(macroCals.fat/macroTotal*100);
      const segs = [[brand, macroCals.protein, `Protein ${pPct}%`], [gold, macroCals.carbs, `Carbs ${cPct}%`], [terracotta, macroCals.fat, `Fat ${fPct}%`]];
      let barX = margin;
      doc.setFontSize(8.5); doc.setFont('helvetica','normal');
      segs.forEach(([color, val, label]) => {
        const w = (val/macroTotal)*contentW;
        doc.setFillColor(...color);
        doc.rect(barX, y, w, 6, 'F');
        doc.setTextColor(...ink2);
        doc.text(label, barX + w/2, y + 11, { align:'center' });
        barX += w;
      });
      y += 17;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
      doc.text('Macro split by share of calories (protein & carbs = 4 kcal/g, fat = 9 kcal/g)', margin, y);
      y += 10;

      // Meal breakdown — one bordered item table per meal, dark header, tinted total row
      y = ensureRoom(y, 10);
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...brand);
      doc.text('Meal Breakdown', margin, y);
      y += 7;

      if (entry.meals && entry.meals.length){
        entry.meals.forEach(meal => {
          y = ensureRoom(y, 20);
          doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...ink);
          doc.text(meal.name, margin, y);
          y += 3;
          const mt = computeConsumedTotals([meal]);
          const body = meal.items.map(item => [item.name, Math.round(item.kcal), item.p, item.c, item.f, item.fib, item.sugar, Math.round(item.sodium||0)]);
          body.push(['Meal total', mt.calories, mt.protein, mt.carbs, mt.fat, mt.fiber, mt.sugar, mt.sodium]);
          doc.autoTable({
            startY: y,
            margin: { left: margin, right: margin },
            head: [['Item','Cal','Prot (g)','Carb (g)','Fat (g)','Fib (g)','Sug (g)','Sod (mg)']],
            body,
            theme: 'grid',
            styles: { font:'helvetica', fontSize:8.5, cellPadding:2.2, textColor: ink, lineColor: border, lineWidth:0.15, halign:'center' },
            headStyles: { fillColor: navy, textColor:[255,255,255], fontStyle:'bold', halign:'center' },
            columnStyles: { 0: { halign:'left' } },
            didParseCell: (data) => {
              if (data.section === 'body' && data.row.index === body.length - 1){
                data.cell.styles.fillColor = brandTint;
                data.cell.styles.fontStyle = 'bold';
              }
            },
          });
          y = doc.lastAutoTable.finalY + 8;
        });
      } else {
        doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...muted);
        doc.text("Item-level detail isn't stored for this day — totals only.", margin, y);
        y += 10;
      }

      if (entry.note && entry.note.trim()){
        y = ensureRoom(y, 16);
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...brand);
        doc.text('Notes', margin, y);
        y += 7;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        const wrappedNote = doc.splitTextToSize(entry.note.trim(), contentW);
        wrappedNote.forEach(line => { y = ensureRoom(y, 5); doc.text(line, margin, y); y += 5; });
      }

      filename = `nourish-daily-${entry.isToday ? todayISO() : entry.date}.pdf`;
    } else {
      const start = st.offset*7;
      const chunk = realDays.slice(start, start+7);
      if (!chunk.length){ st.dataStatus = 'Nothing logged for this week — nothing to export.'; this.render(); return; }
      const oldest = chunk[chunk.length-1], newest = chunk[0];
      const periodLabel = `${formatShortDate(oldest.date)}–${newest.isToday?'Today':formatShortDate(newest.date)}`;
      exportLabel = periodLabel;

      doc.setFillColor(...brand);
      doc.rect(0, 0, pageW, 28, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold'); doc.setFontSize(16);
      doc.text('Weekly Summary', margin, 14);
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text(`Week of ${periodLabel}`, margin, 21);

      let y = 42;
      const avgCal = Math.round(chunk.reduce((a,d)=>a+d.calories,0)/chunk.length);
      const avgProtein = Math.round((chunk.reduce((a,d)=>a+d.protein,0)/chunk.length)*10)/10;
      const inRange = chunk.filter(d=>statusFor('calories', d.calories)==='good').length;

      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...ink);
      doc.text(`Average calories: ${avgCal} kcal`, margin, y); y += 7;
      doc.text(`Average protein: ${avgProtein} g`, margin, y); y += 7;
      doc.text(`Days in range: ${inRange} / ${chunk.length}`, margin, y); y += 12;

      const cols = [margin, margin+42, margin+80, margin+112, margin+144];
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...ink2);
      ['Day','Calories','Protein','Carbs','Fat'].forEach((h,i) => doc.text(h, cols[i], y));
      y += 3;
      doc.setDrawColor(...border);
      doc.line(margin, y, pageW-margin, y);
      y += 6;

      chunk.slice().reverse().forEach(d => {
        y = ensureRoom(y, 6.5);
        const dayLabel = d.isToday ? 'Today' : `${WEEKDAY_NAMES[dateFromISO(d.date).getDay()].slice(0,3)} ${formatShortDate(d.date)}`;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        doc.text(dayLabel, cols[0], y);
        doc.text(`${Math.round(d.calories)} kcal`, cols[1], y);
        doc.text(`${d.protein} g`, cols[2], y);
        doc.text(`${d.carbs} g`, cols[3], y);
        doc.text(`${d.fat} g`, cols[4], y);
        y += 6.5;
      });

      filename = `nourish-weekly-${oldest.date}-to-${newest.isToday?todayISO():newest.date}.pdf`;
    }

    doc.save(filename);
    const exports = st.recentExports || (st.recentExports = []);
    exports.unshift({
      filename,
      whenISO: new Date().toISOString(),
      label: st.mode === 'day' ? `1-Day Report · ${exportLabel}` : `Weekly Summary · ${exportLabel}`,
    });
    if (exports.length > 10) exports.length = 10;
    st.dataStatus = 'PDF saved ✓ — check your Downloads folder.';
    this.render();
  },
  handleImportFile(inputEl){
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      let data;
      try { data = JSON.parse(e.target.result); }
      catch (err) {
        this.state.exportScreen.dataStatus = "Import failed — that file isn't valid JSON.";
        this.render();
        return;
      }
      if (!data || !data.memory || !data.memory.foods || !data.memory.ingredients || !data.memory.usda){
        this.state.exportScreen.dataStatus = "Import failed — file doesn't look like a Nourish backup.";
        this.render();
        return;
      }
      this.state.memory = data.memory;
      if (typeof data.waterMl === 'number') this.state.today.waterMl = data.waterMl;
      if (typeof data.weightKg === 'number') this.state.today.weightKg = data.weightKg;
      if (typeof data.dailyNote === 'string') this.state.today.dailyNote = data.dailyNote;
      if (typeof data.usdaApiKey === 'string') this.state.usdaApiKey = data.usdaApiKey;
      this.state.builtinFoodsSeeded = typeof data.builtinFoodsSeeded === 'boolean' ? data.builtinFoodsSeeded : false;
      if (data.targets) this.state.targets = { ...defaultTargets(), ...data.targets };
      if (Array.isArray(data.meals)) this.state.today.meals = data.meals;
      if (Array.isArray(data.history)) this.state.dayHistory = data.history;
      if (data.dayLog && data.dayLog.currentDate) this.state.dayLog = data.dayLog;
      if (Array.isArray(data.recentExports)) this.state.exportScreen.recentExports = data.recentExports;
      if (!this.state.builtinFoodsSeeded){
        mergeCommonFoodsIntoUsda(this.state.memory.usda);
        this.state.builtinFoodsSeeded = true;
      }
      this.saveLocal();
      this.state.exportScreen.dataStatus = 'Import complete ✓ — your memory has been replaced with the backup.';
      this.render();
    };
    reader.readAsText(file);
  },
  buildMemoryOnlyPayload(){
    return { app:'Nourish', type:'memory', version:1, exportedAt:new Date().toISOString(), memory:this.state.memory };
  },
  exportMemoryOnly(){
    const json = JSON.stringify(this.buildMemoryOnlyPayload(), null, 2);
    const stamp = new Date().toISOString().slice(0,10);
    try {
      saveFileToDevice(`nourish-memory-${stamp}.json`, json);
      this.state.exportScreen.memoryFallbackJson = null;
      this.state.exportScreen.memoryStatus = 'Memory exported ✓ — check your Downloads folder.';
    } catch (err) {
      this.state.exportScreen.memoryFallbackJson = json;
      this.state.exportScreen.memoryStatus = "Couldn't save directly — copy the text below instead.";
    }
    this.render();
  },
  handleMemoryImportFile(inputEl){
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      let data;
      try { data = JSON.parse(e.target.result); }
      catch (err) {
        this.state.exportScreen.memoryStatus = "Import failed — that file isn't valid JSON.";
        this.render();
        return;
      }
      if (!data || !data.memory || !Array.isArray(data.memory.foods) || !Array.isArray(data.memory.ingredients) || !Array.isArray(data.memory.usda)){
        this.state.exportScreen.memoryStatus = "Import failed — file doesn't look like a Nourish memory export.";
        this.render();
        return;
      }
      const kinds = ['foods','ingredients','usda'];
      const autoAdd = { foods:[], ingredients:[], usda:[] };
      const conflicts = [];
      kinds.forEach(kind => {
        const existingList = this.state.memory[kind];
        (data.memory[kind]||[]).forEach(incoming => {
          const match = existingList.find(x => x.name && incoming.name && x.name.trim().toLowerCase() === incoming.name.trim().toLowerCase());
          if (match) conflicts.push({ kind, incoming, existingId:match.id, choice:'skip' });
          else autoAdd[kind].push(incoming);
        });
      });
      if (conflicts.length === 0){
        let total = 0;
        kinds.forEach(kind => {
          autoAdd[kind].forEach(item => {
            this.state.memory[kind].push({ ...item, id:this.genId(item.name||kind), updated:'Just now' });
            total++;
          });
        });
        this.state.exportScreen.memoryStatus = `Import complete ✓ — added ${total} new item${total===1?'':'s'} to your memory.`;
        this.render();
        return;
      }
      this.state.memoryImport = { fileName:file.name, autoAdd, conflicts };
      __scrollTopNext = true;
      this.render();
    };
    reader.readAsText(file);
  },
  setMemoryImportChoice(i, choice){
    this.state.memoryImport.conflicts[i].choice = choice;
    this.render();
  },
  setAllMemoryImportChoices(choice){
    this.state.memoryImport.conflicts.forEach(c => c.choice = choice);
    this.render();
  },
  cancelMemoryImport(){
    this.state.memoryImport = null;
    __scrollTopNext = true;
    this.render();
  },
  applyMemoryImport(){
    const mi = this.state.memoryImport;
    if (!mi) return;
    const kinds = ['foods','ingredients','usda'];
    let added = 0, overwritten = 0, skipped = 0, duplicated = 0;
    kinds.forEach(kind => {
      mi.autoAdd[kind].forEach(item => {
        this.state.memory[kind].push({ ...item, id:this.genId(item.name||kind), updated:'Just now' });
        added++;
      });
    });
    mi.conflicts.forEach(c => {
      if (c.choice === 'skip'){ skipped++; return; }
      if (c.choice === 'duplicate'){
        this.state.memory[c.kind].push({ ...c.incoming, id:this.genId(c.incoming.name||c.kind), updated:'Just now' });
        duplicated++;
        return;
      }
      if (c.choice === 'overwrite'){
        const list = this.state.memory[c.kind];
        const idx = list.findIndex(x => x.id === c.existingId);
        if (idx !== -1) list[idx] = { ...c.incoming, id:c.existingId, updated:'Just now' };
        overwritten++;
      }
    });
    this.state.memoryImport = null;
    const parts = [];
    if (added || duplicated) parts.push(`${added+duplicated} added`);
    if (overwritten) parts.push(`${overwritten} overwritten`);
    if (skipped) parts.push(`${skipped} skipped`);
    this.state.exportScreen.memoryStatus = `Import complete ✓ — ${parts.join(', ')}.`;
    __scrollTopNext = true;
    this.render();
  },
  saveLocal(){
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(this.buildBackupPayload()));
    } catch (e) {
      this.freeSpaceAndRetry();
    }
  },
  freeSpaceAndRetry(){
    let freedCount = 0;
    for (;;){
      const payload = JSON.stringify(this.buildBackupPayload());
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, payload);
        if (freedCount > 0){
          this.state.storageAlert = `This device's storage was full, so your ${freedCount} oldest logged day${freedCount>1?'s':''} ${freedCount>1?'were':'was'} automatically removed to make room (oldest data goes first, like a security-camera drive). Export a backup regularly to keep permanent history.`;
        }
        return;
      } catch (e){
        if (this.state.dayHistory.length === 0){
          this.state.storageAlert = "Storage is full and couldn't be freed automatically. Try removing photos from Memory items, or export/clear old data manually.";
          return;
        }
        this.state.dayHistory.shift();
        freedCount++;
      }
    }
  },
  dismissStorageAlert(){ this.state.storageAlert = null; this.render(); },
  storageUsageBytes(){
    try { return JSON.stringify(this.buildBackupPayload()).length; } catch (e) { return 0; }
  },
  loadLocal(){
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.memory && data.memory.foods && data.memory.ingredients && data.memory.usda) this.state.memory = data.memory;
      if (typeof data.waterMl === 'number') this.state.today.waterMl = data.waterMl;
      if (typeof data.weightKg === 'number') this.state.today.weightKg = data.weightKg;
      if (typeof data.dailyNote === 'string') this.state.today.dailyNote = data.dailyNote;
      if (typeof data.usdaApiKey === 'string') this.state.usdaApiKey = data.usdaApiKey;
      if (data.targets) this.state.targets = { ...defaultTargets(), ...data.targets };
      if (Array.isArray(data.meals)) this.state.today.meals = data.meals;
      if (Array.isArray(data.history)) this.state.dayHistory = data.history;
      if (data.dayLog && data.dayLog.currentDate) this.state.dayLog = data.dayLog;
      if (Array.isArray(data.recentExports)) this.state.exportScreen.recentExports = data.recentExports;
      this.state.builtinFoodsSeeded = typeof data.builtinFoodsSeeded === 'boolean' ? data.builtinFoodsSeeded : false;
      if (!this.state.builtinFoodsSeeded){
        mergeCommonFoodsIntoUsda(this.state.memory.usda);
        this.state.builtinFoodsSeeded = true;
        this.saveLocal();
      }
    } catch (e) { /* ignore corrupt/missing local data */ }
  },

  setDesktopMeal(id){ const d=this.state.desktop; d.openMeal = d.openMeal===id ? null : id; this.render(); },

  render(){
    refreshCompositeFoodTotals();
    renderToolbar();
    renderStage();
    this.saveLocal();
  }
};

/* ================= RENDER: STAGE ================= */

let __lastStageKey = null;
let __scrollTopNext = false;
function renderStage(){
  const s = App.state;
  const stage = document.getElementById('stage');
  const stageKey = s.view + ':' + s.screen;
  const samePlace = __lastStageKey === stageKey;
  const forceTop = __scrollTopNext;
  __scrollTopNext = false;
  const scrollSelectors = ['.scroll-area', '.d-center', '.d-aside'];
  const prevScroll = (samePlace && !forceTop) ? scrollSelectors.map(sel => {
    const el = stage.querySelector(sel);
    return el ? el.scrollTop : null;
  }) : null;

  if (s.view === 'desktop'){
    stage.innerHTML = renderDesktop();
  } else {
    let inner;
    if (s.screen === 'today') inner = renderToday();
    else if (s.screen === 'addfood') inner = renderAddFood();
    else if (s.screen === 'library') inner = renderLibrary();
    else if (s.screen === 'history') inner = renderHistory();
    else if (s.screen === 'trends') inner = renderTrends();
    else if (s.screen === 'settings') inner = renderSettings();
    else inner = renderExport();
    stage.innerHTML = `<div class="phone">${inner}</div>`;
  }

  if (prevScroll){
    scrollSelectors.forEach((sel, i) => {
      if (prevScroll[i] == null) return;
      const el = stage.querySelector(sel);
      if (el) el.scrollTop = prevScroll[i];
    });
  } else if (forceTop){
    scrollSelectors.forEach(sel => {
      const el = stage.querySelector(sel);
      if (el) el.scrollTop = 0;
    });
  }
  __lastStageKey = stageKey;
}

const TODAY_LABELS = { protein:'Protein', carbs:'Carbs', fat:'Fat', fiber:'Fiber', sugar:'Sugar', sodium:'Sodium' };
function buildTodayStats(consumed, expandedStat){
  return Object.keys(TODAY_LABELS).map(id => {
    const key = id === 'protein' ? 'protein' : (id === 'carbs' ? 'carbs' : (id === 'fat' ? 'fat' : (id === 'fiber' ? 'fiber' : (id === 'sugar' ? 'sugar' : 'sodium'))));
    const value = consumed[key];
    const info = targetInfo(id);
    const status = statusFor(id, value);
    return {
      id, label:TODAY_LABELS[id], value:value.toLocaleString(), unit:info.unit, target:info.label,
      status, statusLabel:statusLabelFor(id, value), detail:detailFor(id, value),
      isOpen: expandedStat === id,
    };
  });
}

        <div style="display:flex;gap:16px;margin-top:10px;">
          ${macro.map(([l,pct,c]) => `
            <div style="display:flex;align-items:center;gap:6px;">
              <div class="dot" style="width:9px;height:9px;border-radius:3px;background:${c};"></div>
              <div style="font-size:12px;color:var(--ink-2);">${l} <span class="num" style="color:var(--ink);font-weight:700;">${pct}%</span></div>
            </div>
          `).join('')}
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;margin-bottom:16px;">
        ${stats.map(sItem => {
          const open = sItem.isOpen;
          return `
          <div class="card pad-sm" style="cursor:pointer;" onclick="App.toggleStat('${sItem.id}')">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="font-size:12px;color:var(--ink-2);font-weight:600;">${sItem.label}</div>
              <div class="pill pill-${sItem.status==='good'?'good':(sItem.status==='warning'?'warn':'crit')}">${sItem.statusLabel}</div>
            </div>
            <div class="num disp" style="font-size:20px;font-weight:800;margin-top:4px;">${sItem.value}<span style="font-size:12px;font-weight:600;color:var(--ink-2);"> ${sItem.unit}</span></div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">${sItem.target}</div>
            ${open ? `<div style="font-size:11.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.4;">${sItem.detail}</div>` : ''}
          </div>`;
        }).join('')}
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:15px;font-weight:700;">Meal breakdown</div>
        <button onclick="App.setScreen('addfood')" style="background:none;border:none;color:var(--brand);font-size:12.5px;font-weight:700;cursor:pointer;">+ Log food</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
        ${st.meals.length===0 ? `
          <div class="card pad" style="text-align:center;color:var(--muted);font-size:13px;">
            Nothing logged today yet.<br/>Tap <strong style="color:var(--ink-2);">+ Log food</strong> above to get started.
          </div>
        ` : st.meals.map(meal => {
          const open = st.expandedMeal === meal.id;
          return `
          <div class="card" style="overflow:hidden;">
            <div class="accordion-head pad-sm" onclick="App.toggleMeal('${meal.id}')">
              <div style="min-width:0;">
                <div style="font-size:14px;font-weight:700;">${meal.name}</div>
                <div style="font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;">${meal.subtitle}</div>
              </div>
              <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
                <div class="num" style="font-size:14px;font-weight:700;">${mealKcal(meal)} kcal</div>
                <div class="chev ${open?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
            </div>
            ${open ? `
              <div style="padding:0 14px 12px 14px;border-top:1px solid var(--border);">
                ${meal.items.length===0 ? `<div style="padding:12px 0;font-size:12px;color:var(--muted);">Nothing logged here yet.</div>` : meal.items.map((item,idx) => {
                  const removeKey = meal.id+':'+idx;
                  if (st.confirmRemoveKey === removeKey){
                    return `
                    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                      <div style="font-size:12px;font-weight:700;margin-bottom:8px;">Remove &ldquo;${item.name}&rdquo;?</div>
                      <div style="display:flex;gap:8px;">
                        <button onclick="event.stopPropagation();App.cancelRemoveItem()" style="flex:1;padding:7px 0;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Cancel</button>
                        <button onclick="event.stopPropagation();App.confirmRemoveItem('${meal.id}',${idx})" style="flex:1;padding:7px 0;border-radius:8px;background:var(--critical);color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Remove</button>
                      </div>
                    </div>`;
                  }
                  return `
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
                    <div style="font-size:12.5px;min-width:0;">
                      <div style="font-weight:600;">${item.name}</div>
                      <div style="color:var(--muted);font-size:11px;margin-top:1px;">P ${item.p}g · C ${item.c}g · F ${item.f}g · Fib ${item.fib}g</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:10px;">
                      <div class="num" style="font-size:12.5px;font-weight:700;">${item.kcal}</div>
                      <button onclick="event.stopPropagation();App.requestRemoveItem('${meal.id}',${idx})" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                      </button>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            ` : ''}
          </div>`;
        }).join('')}
      </div>

      <div class="card pad" style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-2);">Water</div>
          <div class="pill ${waterGood?'pill-good':'pill-warn'}">${waterGood?'In range':'Under'}</div>
        </div>
        <div class="num disp" style="font-size:22px;font-weight:800;">${waterL} L <span style="font-size:12px;font-weight:600;color:var(--ink-2);">of ${waterTarget.label}</span></div>
        <div style="height:8px;border-radius:5px;background:var(--border);margin-top:10px;overflow:hidden;">
          <div style="height:100%;width:${waterPct}%;border-radius:5px;background:var(--brand);"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button onclick="App.addWater(-250)" ${st.waterMl<=0?'disabled':''} style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);font-family:inherit;opacity:${st.waterMl<=0?'0.5':'1'};">− 250 ml</button>
          <button onclick="App.addWater(250)" style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:var(--brand-tint);color:var(--brand-dark);font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">+ 250 ml</button>
          <button onclick="App.addWater(500)" style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:var(--brand-tint);color:var(--brand-dark);font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">+ 500 ml</button>
        </div>
      </div>

      <div class="card pad" style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-2);">Weight</div>
          ${hasWeight ? `<div class="pill ${weightStatus==='good'?'pill-good':(weightStatus==='warning'?'pill-warn':'pill-crit')}">${statusLabelFor('weight', st.weightKg)}</div>` : ''}
        </div>
        <div class="num disp" style="font-size:22px;font-weight:800;">${hasWeight ? st.weightKg.toFixed(1)+' kg' : '<span style="font-size:14px;color:var(--muted);font-weight:600;">Not logged today</span>'} <span style="font-size:12px;font-weight:600;color:var(--ink-2);">goal ${weightTarget.label}</span></div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <input id="weight-input" type="number" step="0.1" placeholder="e.g. 84.0" value="${hasWeight ? st.weightKg : ''}" style="flex:1;text-align:left;"/>
          <button onclick="App.saveWeight()" style="flex-shrink:0;padding:9px 16px;border-radius:10px;background:var(--brand-tint);color:var(--brand-dark);font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">Save</button>
        </div>
      </div>

      ${st.meals.length > 0 ? `
      <div class="card" style="overflow:hidden;">
        <div class="accordion-head pad" onclick="App.toggleNotes()">
          <div style="font-size:13px;font-weight:700;color:var(--ink-2);">Notes &amp; accuracy</div>
          <div class="chev ${st.notesOpen?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
        ${st.notesOpen ? `<div style="padding:0 16px 14px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.5;">
          ${stats.filter(s => s.status !== 'good').map(s => `${s.label}: ${s.detail}`).join(' ') || 'Everything logged so far is within range.'}
        </div>` : ''}
      </div>
      ` : ''}

      <div class="card pad" style="margin-top:14px;">
        <div style="font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px;">Today's notes</div>
        <textarea id="daily-note-input" placeholder="Anything worth remembering about today — how you felt, what to adjust next time..." style="width:100%;min-height:70px;padding:10px 11px;border-radius:10px;border:1px solid var(--border);font-size:12.5px;font-family:inherit;resize:vertical;">${(st.dailyNote||'').replace(/</g,'&lt;')}</textarea>
        <button onclick="App.saveDailyNote()" style="margin-top:8px;padding:9px 16px;border-radius:10px;background:${st.noteSaved?'var(--good)':'var(--brand-tint)'};color:${st.noteSaved?'#fff':'var(--brand-dark)'};font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">${st.noteSaved?'Saved ✓':'Save note'}</button>
        <div style="font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.4;">Included in your PDF export for this day.</div>
      </div>
    </div>

    <button class="fab" onclick="App.setScreen('addfood')" title="Log food">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>

    ${bottomNav('today')}
  `;
}

/* ---------- Add food ---------- */
function srcTag(label, cls){
  return `<span class="pill ${cls} src-tag">${label}</span>`;
}

function renderSavedFoodRow(f, st){
  if (Array.isArray(f.components)){
    const expanded = st.expandedSavedId === f.id;
    return `
    <div data-name="${f.name.toLowerCase()}" class="card pad-sm">
      <div onclick="App.toggleAddFoodSavedExpand('${f.id}')" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
        <div style="min-width:0;">
          <div style="font-size:13.5px;font-weight:700;">${srcTag('Saved','pill-brand')}${f.name}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:1px;">${f.recipe.length>46 ? f.recipe.slice(0,46)+'…' : f.recipe}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:8px;">
          <div class="num" style="font-size:13px;font-weight:700;color:var(--ink-2);">${f.kcal} kcal</div>
          <div class="chev ${expanded?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
      </div>
      ${expanded ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;">
          ${f.components.map(comp => {
            const per100 = resolveComponentPer100(comp);
            const kcal = Math.round((per100.kcal||0)*(comp.weight||0)/100);
            return `
            <div>
              <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">${comp.name}</div>
              <div style="display:flex;align-items:center;gap:8px;">
                <input id="cf-weight-${f.id}-${comp.id}" type="number" value="${comp.weight}" oninput="App.scaleComposedComponent('${f.id}','${comp.id}', this)" style="width:0;flex:1;text-align:left;"/>
                <div style="font-size:12px;color:var(--muted);">${comp.unit||'g'}</div>
                <div id="cf-kcal-${f.id}-${comp.id}" class="num" style="font-size:13px;font-weight:700;color:var(--brand-dark);flex-shrink:0;">${kcal} kcal</div>
              </div>
            </div>`;
          }).join('')}
          <div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px;">
            <div style="font-size:12.5px;font-weight:700;">Total: <span id="cf-total-${f.id}">${f.kcal}</span> kcal</div>
            <button onclick="App.addComposedFoodToMeal('${f.id}')" style="flex-shrink:0;padding:8px 14px;border-radius:9px;background:${st.flashId===f.id?'var(--good)':'var(--brand)'};color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">${st.flashId===f.id?'Added ✓':'+ Add to '+st.targetMeal}</button>
          </div>
        </div>
      ` : ''}
    </div>`;
  }
  const sel = !!st.selected[f.id];
  return `
  <div data-name="${f.name.toLowerCase()}" onclick="App.toggleSelected('${f.id}')" class="pad-sm" style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid ${sel?'var(--brand)':'var(--border)'};border-radius:13px;cursor:pointer;">
    <div style="min-width:0;">
      <div style="font-size:13.5px;font-weight:700;">${srcTag('Saved','pill-brand')}${f.name}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:1px;">${f.recipe.length>46 ? f.recipe.slice(0,46)+'…' : f.recipe}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;padding-left:8px;">
      <div class="num" style="font-size:13px;font-weight:700;color:var(--ink-2);">${f.kcal} kcal</div>
      <div style="width:20px;height:20px;border-radius:6px;border:1.5px solid ${sel?'var(--brand)':'var(--border)'};background:${sel?'var(--brand)':'transparent'};display:flex;align-items:center;justify-content:center;">
        ${sel ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}
      </div>
    </div>
  </div>`;
}

        <div style="font-size:13.5px;font-weight:700;">${srcTag('Ingredient','pill-neutral')}${ing.name}</div>

    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">

function renderAddFood(){
  const st = App.state.addfood;
  const tabs = [['saved','Saved'],['ingredients','Ingredients'],['usda','USDA']];
  const mealDefs = ['Breakfast','Lunch','Snack','Dinner'];
  const addCount = Object.values(st.selected).filter(Boolean).length;

  const groups = `<div id="addfood-groups">
    <div data-kind="saved" style="display:${st.activeTab==='saved'?'flex':'none'};flex-direction:column;gap:8px;">
      ${App.state.memory.foods.map(f => renderSavedFoodRow(f, st)).join('')}
    </div>
    <div data-kind="ingredients" style="display:${st.activeTab==='ingredients'?'flex':'none'};flex-direction:column;gap:8px;">
      ${App.state.memory.ingredients.map(ing => renderIngredientAddRow(ing, st)).join('')}
    </div>
    <div data-kind="usda" style="display:${st.activeTab==='usda'?'flex':'none'};flex-direction:column;gap:8px;">
      ${App.state.memory.usda.map(u => renderUsdaAddRow(u, st)).join('')}
    </div>
  </div>`;

  let quickLookup = '';
  {
    const r = st.lookupResult;
    let resultHtml = '';
    if (st.lookupLoading){
      resultHtml = `<div style="margin-top:10px;padding:10px;background:var(--brand-tint);color:var(--brand-dark);border-radius:10px;font-size:11.5px;font-weight:600;">Searching USDA FoodData Central…</div>`;
    } else if (r && r.missingKey){
      resultHtml = `<div style="margin-top:10px;padding:12px;background:var(--warning-tint);color:var(--warning);border-radius:10px;font-size:12px;font-weight:600;line-height:1.4;">
        &ldquo;${r.query}&rdquo; isn't in your saved foods, and no USDA API key is set up yet, so live search can't run.
        <button onclick="App.setScreen('settings')" style="display:block;width:100%;margin-top:10px;padding:9px 0;border-radius:9px;background:var(--warning);color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Add a USDA API key in Settings</button>
      </div>`;
    } else if (r && r.noConnection){
      resultHtml = `<div style="margin-top:10px;padding:10px;background:var(--warning-tint);color:var(--warning);border-radius:10px;font-size:11.5px;font-weight:600;line-height:1.4;">Couldn't find &ldquo;${r.query}&rdquo; in your saved foods, and couldn't reach the internet to search USDA FoodData Central. Check your connection and try again.</div>`;
    } else if (r && r.notFound){
      resultHtml = `<div style="margin-top:10px;padding:10px;background:var(--warning-tint);color:var(--warning);border-radius:10px;font-size:11.5px;font-weight:600;line-height:1.4;">Couldn't find &ldquo;${r.query}&rdquo; in your saved foods or in USDA FoodData Central. Try a different spelling or a more common name.</div>`;
    } else if (r){
      resultHtml = `
        <div style="margin-top:10px;padding:12px;background:var(--brand-tint);border-radius:12px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <div style="font-size:13px;font-weight:800;color:var(--brand-dark);">${r.name} · ${r.basis}</div>
            <div class="num disp" style="font-size:15px;font-weight:800;color:var(--brand-dark);">${r.kcal} kcal</div>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:8px;">${r.source==='api' ? 'Live from USDA FoodData Central' : 'From your saved foods'}</div>
          <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px;margin-bottom:10px;">
            ${[['Prot',r.p+'g'],['Carb',r.c+'g'],['Fat',r.f+'g'],['Fib',r.fib+'g'],['Sug',r.sugar+'g'],['Sod',r.sodium+'mg']].map(([l,v]) => `
              <div style="background:#fff;border-radius:8px;padding:6px 4px;text-align:center;">
                <div class="num" style="font-size:12px;font-weight:700;">${v}</div>
                <div style="font-size:9px;color:var(--muted);">${l}</div>
              </div>`).join('')}
          </div>
          ${r.saved
            ? `<div style="text-align:center;font-size:12px;font-weight:700;color:var(--brand-dark);">Saved to memory ✓ — find it in the USDA list below</div>`
            : (r.alreadySaved
              ? `<div style="text-align:center;font-size:12px;font-weight:700;color:var(--brand-dark);">Already in your USDA list below</div>`
              : `<button onclick="App.saveLookupToMemory()" style="width:100%;padding:9px 0;border-radius:9px;background:var(--brand);color:#fff;border:none;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;">Save to memory as USDA reference</button>`)}
        </div>`;
    }
    quickLookup = `

        <div class="chev ${open?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

            ${f.components.map(comp => {

              return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;background:var(--surface);border-radius:8px;padding:7px 10px;">
                <div>${comp.name} · ${comp.weight}${comp.unit||'g'}${live?'':' <span style="color:var(--muted);">(fixed)</span>'}</div>
                <div class="num" style="font-weight:700;flex-shrink:0;padding-left:8px;">${kcal} kcal</div>
              </div>`;
            }).join('')}
          </div>
        ` : `<div style="font-size:11px;color:var(--muted);margin:10px 0 6px 0;">${f.recipe}</div>`}
        <div style="display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:6px;">
          ${macrosArrayFrom(f).map(([l,v]) => `
            <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;">
              <div class="num" style="font-size:12.5px;font-weight:700;">${v}</div>

  </div>`;
}

  let body = '';

          return `
          <div class="card" style="overflow:hidden;">
            <div class="accordion-head pad-sm" onclick="App.toggleHistoryRow(${i})">
              <div>
                <div style="font-size:13.5px;font-weight:700;">${label}</div>
                <div style="display:flex;gap:5px;margin-top:6px;">
                  <div class="dot" style="background:${dotColor(statusFor('calories', d.calories)==='good')};"></div>
                  <div class="dot" style="background:${dotColor(statusFor('protein', d.protein)==='good')};"></div>
                  <div class="dot" style="background:${dotColor(statusFor('fiber', d.fiber)==='good')};"></div>
                  <div class="dot" style="background:${dotColor(statusFor('sugar', d.sugar)==='good')};"></div>
                </div>
              </div>
              <div class="num disp" style="font-size:15px;font-weight:800;">${Math.round(d.calories)} <span style="font-size:11px;font-weight:600;color:var(--muted);">kcal</span></div>
            </div>
            ${open ? `
              <div style="padding:0 13px 12px 13px;border-top:1px solid var(--border);">
                <div style="display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:6px;margin-top:10px;">
                  <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${d.protein}g</div><div style="font-size:9.5px;color:var(--muted);">Protein</div></div>
                  <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${d.fiber}g</div><div style="font-size:9.5px;color:var(--muted);">Fiber</div></div>
                  <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${d.sugar}g</div><div style="font-size:9.5px;color:var(--muted);">Sugar</div></div>
                  <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${Math.round(d.calories)}</div><div style="font-size:9.5px;color:var(--muted);">Calories</div></div>
                </div>
                ${!d.isToday ? `
                  <button onclick="App.requestDeleteDay('${d.date}')" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:9px 0;border-radius:9px;border:1.5px dashed var(--critical);background:transparent;color:var(--critical);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

          </div>`;

  } else if (st.view === 'week'){

    body = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${chunks.map((days, w) => {
          const nDays = days.length;
          const avgCal = Math.round(days.reduce((a,d)=>a+d.calories,0)/nDays);
          const avgProtein = Math.round((days.reduce((a,d)=>a+d.protein,0)/nDays)*10)/10;
          const avgFiber = Math.round((days.reduce((a,d)=>a+d.fiber,0)/nDays)*10)/10;
          const inRange = days.filter(d=>statusFor('calories', d.calories)==='good').length;
          const oldest = days[days.length-1], newest = days[0];
          const label = w===0 ? `This week so far (${formatShortDate(oldest.date)}–${newest.isToday?'Today':formatShortDate(newest.date)})` : `${formatShortDate(oldest.date)}–${formatShortDate(newest.date)}`;
          return `
          <div class="card pad-sm">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <div style="font-size:13.5px;font-weight:700;">${label}</div>
              <div class="pill" style="background:var(--brand-tint);color:var(--brand-dark);">${inRange}/${nDays} in range</div>

              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:15px;font-weight:800;">${avgCal}</div><div style="font-size:9.5px;color:var(--muted);">avg kcal</div></div>

              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:15px;font-weight:800;">${avgFiber}g</div><div style="font-size:9.5px;color:var(--muted);">avg fiber</div></div>
            </div>

        }).join('')}
      </div>
      ${realDays.length < 7 ? `<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5;">Averaging over ${realDays.length} logged day${realDays.length===1?'':'s'} so far — this fills in as you go.</div>` : ''}`;
  } else {
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstWeekday = new Date(year, month, 1).getDay();
    const byDate = new Map(realDays.map(d => [d.date, d]));
    const todayIso = App.state.dayLog.currentDate;
    let cells = '';
    for (let pad=0; pad<firstWeekday; pad++) cells += `<div></div>`;
    for (let day=1; day<=daysInMonth; day++){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isSelected = st.selectedDayNum === day;
      const ring = isSelected ? 'outline:2px solid var(--brand-dark);outline-offset:-2px;' : '';
      const entry = byDate.get(iso);
      if (iso === todayIso && !entry){
        cells += `<div onclick="App.selectMonthDay(${day})" style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#EEEEEC;color:var(--ink-2);font-size:11px;font-weight:700;cursor:pointer;${ring}">${day}</div>`;
      } else if (!entry){
        cells += `<div style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#C3C2B7;font-size:11px;font-weight:700;">${day}</div>`;
      } else {
        const good = statusFor('calories', entry.calories)==='good';
        const bg = !good ? 'var(--critical-tint)' : 'var(--good-tint)';
        const color = !good ? 'var(--critical)' : 'var(--good)';
        cells += `<div onclick="App.selectMonthDay(${day})" style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;background:${bg};color:${color};font-size:11px;font-weight:700;cursor:pointer;${ring}">${day}</div>`;
      }
    }
    let selectedPanel = '';
    if (st.selectedDayNum){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(st.selectedDayNum).padStart(2,'0')}`;
      const entry = byDate.get(iso);
      if (!entry){
        selectedPanel = `<div class="card pad-sm" style="background:var(--brand-tint);border:none;margin-bottom:10px;"><div style="font-size:12.5px;font-weight:700;color:var(--brand-dark);">${formatShortDate(iso)} — nothing logged</div></div>`;
      } else {
        selectedPanel = `<div class="card pad-sm" style="background:var(--brand-tint);border:none;margin-bottom:10px;">
          <div style="font-size:12.5px;font-weight:700;color:var(--brand-dark);margin-bottom:6px;">${entry.isToday ? 'Today' : formatShortDate(iso)}</div>
          <div style="font-size:11.5px;color:var(--brand-dark);">${Math.round(entry.calories)} kcal · ${entry.protein}g protein · ${entry.fiber}g fiber</div>
        </div>`;
      }
    }
    body = `
      <div style="font-size:13.5px;font-weight:700;margin-bottom:10px;">${MONTH_NAMES[month]} ${year}</div>

        ${['S','M','T','W','T','F','S'].map(l=>`<div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;">${l}</div>`).join('')}

      </div>`;
  }

  return `
    <div class="topbar">
      <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">History</div>
      <div class="seg">
        ${views.map(([id,label]) => `<button class="seg-btn" style="flex:1;${st.view===id?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setHistoryView('${id}')">${label}</button>`).join('')}

    <div class="scroll-area" style="padding:14px 18px 90px 18px;">${body}</div>
    ${bottomNav('history')}

/* ---------- Trends ---------- */
const TREND_CATS = [
  { id:'calories', label:'Calories', decimals:0 },
  { id:'protein', label:'Protein', decimals:1 },
  { id:'carbs', label:'Carbs', decimals:1 },
  { id:'fat', label:'Fat', decimals:1 },
  { id:'fiber', label:'Fiber', decimals:1 },
  { id:'sugar', label:'Sugar', decimals:1 },
  { id:'sodium', label:'Sodium', decimals:0 },
  { id:'water', label:'Water', decimals:2 },
  { id:'weight', label:'Weight', decimals:1 },
];
function renderTrends(){
  const st = App.state.trends;
  const cat = TREND_CATS.find(c=>c.id===st.activeCat) || TREND_CATS[0];
  const t = App.state.targets[cat.id];
  const unit = t.unit;
  const rangeDefs = [['7d','7D',7],['30d','30D',30],['90d','90D',90]];
  const rd = rangeDefs.find(r=>r[0]===st.range) || rangeDefs[0];
  const n = rd[2];

  const realDays = App.allRealDays();
  const valueForDay = (d) => {
    if (cat.id === 'weight') return typeof d.weightKg === 'number' ? d.weightKg : null;
    if (cat.id === 'water') return Math.round((d.waterMl/1000)*100)/100;
    return d[cat.id];
  };
  const windowed = realDays.slice(0, n);
  const series = windowed.map(d => ({ date:d.date, isToday:d.isToday, v: valueForDay(d) })).filter(p => p.v !== null).reverse();

  const catChips = `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
    ${TREND_CATS.map(c => `<button class="chip ${st.activeCat===c.id?'active':''}" onclick="App.setTrendCat('${c.id}')">${c.label}</button>`).join('')}
  </div>`;
  const rangeTabs = `<div class="seg" style="margin-bottom:14px;box-shadow:none;border:1px solid var(--border);">
    ${rangeDefs.map(([id,label]) => `<button class="seg-btn" style="flex:1;${st.range===id?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setTrendRange('${id}')">${label}</button>`).join('')}
  </div>`;

  if (series.length < 2){
    return `
      <div class="topbar">
        <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">Trends</div>
        ${catChips}
      </div>
      <div class="scroll-area" style="padding:16px 18px 90px 18px;">
        ${rangeTabs}
        <div class="card pad" style="text-align:center;color:var(--muted);font-size:13px;line-height:1.6;padding:36px 20px;">
          Not enough data yet for a ${cat.label.toLowerCase()} trend.<br/>Keep logging — this fills in once you have at least two days.
        </div>
      </div>
      ${bottomNav('trends')}
    `;
  }

  const values = series.map(p=>p.v);
  const targetLow = t.kind==='range' ? t.low : (t.kind==='floor' ? t.value : null);
  const targetHigh = t.kind==='range' ? t.high : (t.kind==='ceiling' ? t.value : null);
  const boundCandidates = values.concat([targetLow, targetHigh].filter(v=>v!=null));
  let domainMin = Math.min(...boundCandidates);
  let domainMax = Math.max(...boundCandidates);
  if (domainMin === domainMax){ domainMin -= 1; domainMax += 1; }
  const padAmt = (domainMax - domainMin) * 0.15;
  domainMin = Math.max(0, domainMin - padAmt);
  domainMax = domainMax + padAmt;

  const trendStatusFor = (v) => statusFor(cat.id, v);
  const colorFor = (s) => s==='good' ? 'var(--good)' : (s==='warning' ? 'var(--warning)' : 'var(--critical)');

  const plotTop=10, plotBottom=146, plotH=plotBottom-plotTop;
  const yFor = (v) => plotBottom - ((v-domainMin)/(domainMax-domainMin))*plotH;
  const m = series.length;
  const xFor = (k) => m===1 ? 171 : (k/(m-1))*342;
  const linePath = series.map((s,k) => `${k===0?'M':'L'} ${xFor(k).toFixed(1)},${yFor(s.v).toFixed(1)}`).join(' ');

  let bandLow,bandHigh,bandLabel;
  if (t.kind==='range'){ bandLow=t.low; bandHigh=t.high; bandLabel=`Target ${t.low}–${t.high}${unit}`; }
  else if (t.kind==='ceiling'){ bandLow=domainMin; bandHigh=t.value; bandLabel=`Under ${t.value}${unit}`; }
  else { bandLow=t.value; bandHigh=domainMax; bandLabel=`At least ${t.value}${unit}`; }
  const bandY = yFor(bandHigh);
  const bandH = Math.max(2, yFor(bandLow)-yFor(bandHigh));

  const showPoints = m<=14;
  const points = series.map((s,k) => ({x:xFor(k).toFixed(1), y:yFor(s.v).toFixed(1), color:colorFor(trendStatusFor(s.v)), k}));

  let tooltip = '';
  if (st.activePoint!==null && series[st.activePoint]){
    const s = series[st.activePoint];
    const label = s.isToday ? 'Today' : formatShortDate(s.date);
    // xFor() is in the SVG's 0-342 viewBox units, but the SVG is width:100% of a variable-width
    // card — express as a % of that width (not px) so it lines up regardless of screen size, and
    // clamp so the centered tooltip can't push off the left/right edge for points near either end.
    const leftPct = Math.min(88, Math.max(12, (xFor(st.activePoint)/342)*100));
    const top = yFor(s.v)-34;
    tooltip = `<div style="position:absolute;background:var(--brand-dark);color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;left:${leftPct.toFixed(2)}%;top:${top}px;white-space:nowrap;transform:translateX(-50%);z-index:2;">${label} · ${s.v}${unit}</div>`;
  }

  const avg = values.reduce((a,v)=>a+v,0)/values.length;
  const avgValue = `${Math.round(avg*Math.pow(10,cat.decimals))/Math.pow(10,cat.decimals)}${unit}`;
  const pctInRange = Math.round((series.filter(s=>trendStatusFor(s.v)==='good').length/series.length)*100);
  const ideal = t.kind==='range' ? (t.low+t.high)/2 : (t.kind==='ceiling' ? t.value*0.85 : t.value*1.15);
  let bestIdx=0, bestDist=Infinity;
  series.forEach((s,k)=>{ const dist=Math.abs(s.v-ideal); if (dist<bestDist){bestDist=dist; bestIdx=k;} });
  const bestSeries = series[bestIdx];
  const bestValue = `${bestSeries.v}${unit}`;
  const bestLabel = bestSeries.isToday ? 'today' : formatShortDate(bestSeries.date);

  return `
    <div class="topbar">
      <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">Trends</div>
      ${catChips}
    </div>
    <div class="scroll-area" style="padding:16px 18px 90px 18px;">
      ${rangeTabs}
      <div class="card pad" style="position:relative;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-2);">${cat.label} · ${series.length} day${series.length===1?'':'s'} logged</div>
          <div style="font-size:11px;color:var(--muted);">${bandLabel}</div>
        </div>
        ${tooltip}
        <svg viewBox="0 0 342 176" width="100%" height="176" style="overflow:visible;margin-top:6px;">
          <rect x="0" y="${bandY.toFixed(1)}" width="342" height="${bandH.toFixed(1)}" fill="rgba(28,92,75,0.10)" rx="4"/>
          <line x1="0" y1="146" x2="342" y2="146" stroke="#e1e0d9" stroke-width="1"/>
          <path d="${linePath}" fill="none" stroke="var(--protein)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${showPoints ? points.map(pt => `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="${pt.color}" stroke="#fff" stroke-width="2" style="cursor:pointer;" onclick="App.selectTrendPoint(${pt.k})"/>`).join('') : ''}
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:4px;">
          <div style="font-size:10.5px;color:var(--muted);">${series[0].isToday ? 'Today' : formatShortDate(series[0].date)}</div>
          <div style="font-size:10.5px;color:var(--muted);">${series[series.length-1].isToday ? 'Today' : formatShortDate(series[series.length-1].date)}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px;margin-top:14px;">
        <div class="card" style="padding:12px 8px;text-align:center;"><div class="num disp" style="font-size:17px;font-weight:800;">${avgValue}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Average</div></div>
        <div class="card" style="padding:12px 8px;text-align:center;"><div class="num disp" style="font-size:17px;font-weight:800;color:var(--brand-dark);">${pctInRange}%</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Days in range</div></div>
        <div class="card" style="padding:12px 8px;text-align:center;"><div class="num disp" style="font-size:17px;font-weight:800;">${bestValue}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Best day (${bestLabel})</div></div>
      </div>
    </div>
    ${bottomNav('trends')}
  `;
}

/* ---------- Export ---------- */

  const totalAutoAdd = mi.autoAdd.foods.length + mi.autoAdd.ingredients.length + mi.autoAdd.usda.length;
  const choices = [['skip','Skip'],['duplicate','Add as duplicate'],['overwrite','Overwrite']];

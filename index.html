function mealKcal(meal){ return Math.round(meal.items.reduce((a,it)=>a+it.kcal,0)*10)/10; }
function computeConsumedTotals(meals){
  const t = { calories:0, protein:0, carbs:0, fat:0, fiber:0, sugar:0, sodium:0 };
  meals.forEach(meal => meal.items.forEach(it => {
    t.calories += it.kcal; t.protein += it.p; t.carbs += it.c; t.fat += it.f; t.fiber += it.fib;
    t.sugar += it.sugar||0; t.sodium += it.sodium||0;
  }));
  const round1 = n => Math.round(n*10)/10;
  return { calories:Math.round(t.calories), protein:round1(t.protein), carbs:round1(t.carbs), fat:round1(t.fat), fiber:round1(t.fiber), sugar:round1(t.sugar), sodium:Math.round(t.sodium) };
}

function parseFoodQuery(raw){
  const q = (raw||'').trim().toLowerCase();
  if (!q) return null;
  const m = q.match(/^(\d+(?:\.\d+)?)\s*(g|gram|grams|ml|milliliter|milliliters)?\s+(.+)$/);
  let grams=null, count=null, name;
  if (m){
    const num = parseFloat(m[1]);
    if (m[2]) grams = num; else count = num;
    name = m[3].trim();
  } else {
    name = q; count = 1;
  }
  const nameNorm = name.replace(/e?s$/,'');
  const food = COMMON_FOODS.find(f => f.name.toLowerCase() === name)
    || COMMON_FOODS.find(f => f.name.toLowerCase().split(',')[0] === nameNorm)
    || COMMON_FOODS.find(f => f.name.toLowerCase().includes(nameNorm) || nameNorm.includes(f.name.toLowerCase().split(',')[0]));
  if (!food) return { notFound:true, query:raw };
  let usedGrams, basis;
  if (grams != null){ usedGrams = grams; basis = `${grams}${m[2] && m[2][0]==='m' ? 'ml' : 'g'}`; }
  else {
    const pieceG = food.pieceG || 100;
    usedGrams = count * pieceG;
    basis = food.pieceG ? `${count} × ~${pieceG}g` : `${count} × 100g (no standard piece size)`;
  }
  const scale = usedGrams/100;
  const r = food.per100;
  const round1 = n => Math.round(n*scale*10)/10;
  return {
    notFound:false, name:food.name, grams:usedGrams, basis,
    kcal:Math.round(r.kcal*scale), p:round1(r.p), c:round1(r.c), f:round1(r.f),
    fib:round1(r.fib), sugar:round1(r.sugar), sodium:Math.round(r.sodium*scale),
  };
}

/* ---------- Real dates & liters formatting ---------- */
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateFromISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatFullDate(iso){
  const d = dateFromISO(iso);
  return `${WEEKDAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function formatShortDate(iso){
  const d = dateFromISO(iso);
  return `${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}`;
}
function formatLiters(ml){
  const l = Math.round((ml/1000)*100)/100;
  return String(l);
}
function saveFileToDevice(filename, text){
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- Targets (editable in Settings) ---------- */
function defaultTargets(){
  return {
    calories: { kind:'ceiling', value:1900, unit:'kcal' },
    protein: { kind:'range', low:135, high:155, unit:'g' },
    carbs: { kind:'range', low:150, high:190, unit:'g' },
    fat: { kind:'range', low:50, high:70, unit:'g' },
    fiber: { kind:'floor', value:30, unit:'g' },
    sugar: { kind:'ceiling', value:50, unit:'g' },
    sodium: { kind:'ceiling', value:2300, unit:'mg' },
    water: { kind:'range', low:2.5, high:3, unit:'L' },
    weight: { kind:'range', low:78, high:82, unit:'kg' },
  };
}
function targetInfo(id){
  const t = App.state.targets[id];
  if (t.kind === 'range') return { label:`${t.low.toLocaleString()}–${t.high.toLocaleString()} ${t.unit}`, low:t.low, high:t.high, unit:t.unit };
  if (t.kind === 'ceiling') return { label:`Under ${t.value.toLocaleString()} ${t.unit}`, high:t.value, unit:t.unit };
  return { label:`≥ ${t.value.toLocaleString()} ${t.unit}`, low:t.value, unit:t.unit };
}
function statusFor(id, value){
  const t = App.state.targets[id];
  if (t.kind === 'ceiling') return value <= t.value ? 'good' : 'critical';
  if (t.kind === 'floor') return value >= t.value ? 'good' : 'warning';
  if (value < t.low) return 'warning';
  if (value > t.high) return 'critical';
  return 'good';
}
function statusLabelFor(id, value){
  const s = statusFor(id, value);
  if (s === 'good') return 'In range';
  return s === 'warning' ? 'Under' : 'Over';
}
function detailFor(id, value){
  const t = App.state.targets[id];
  const info = targetInfo(id);
  const round1 = n => Math.round(n*10)/10;
  if (t.kind === 'range'){
    if (value < t.low) return `${round1(t.low-value)} ${info.unit} under target.`;
    if (value > t.high) return `${round1(value-t.high)} ${info.unit} over target.`;
    return `Within the ${info.label} range.`;
  }
  if (t.kind === 'ceiling'){
    return value <= t.value ? `Comfortably under the ${t.value}${info.unit} ceiling.` : `${round1(value-t.value)} ${info.unit} over the ceiling.`;
  }
  return value >= t.value ? `At or above the ≥${t.value}${info.unit} floor.` : `${round1(t.value-value)} ${info.unit} under the floor.`;
}

      : { ...shared, id:item.id, recipe:item.recipe || `Moved from Ingredients — ${item.kcal} kcal per 100${item.unit||'g'}.`, updated:'Just now' };

  exportPdf(){
    const st = this.state.exportScreen;
    if (!window.jspdf || !window.jspdf.jsPDF){
      st.dataStatus = "Couldn't load the PDF engine — try reopening the app and try again.";
      this.render();
      return;
    }
    const realDays = this.allRealDays();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 16;
    const contentW = pageW - margin*2;
    const brand=[28,92,75], brandDark=[18,63,52], ink=[20,24,26], ink2=[91,97,95], muted=[139,144,141];
    const good=[12,163,12], warning=[185,121,10], critical=[208,59,59];
    const protein=[42,120,214], carbs=[235,104,52], fat=[27,175,122], border=[225,225,222];
    const ensureRoom = (y, needed) => { if (y + needed > pageH - 16){ doc.addPage(); return 20; } return y; };
    const statusColorFor = s => s==='good' ? good : (s==='warning' ? warning : critical);
    const statusTextFor = s => s==='good' ? 'OK' : (s==='warning' ? 'LOW' : 'HIGH');

    let filename, exportLabel;

    if (st.mode === 'day'){
      const entry = realDays[st.offset];
      if (!entry){ st.dataStatus = 'Nothing logged for this day — nothing to export.'; this.render(); return; }
      const dateLabel = entry.isToday ? formatFullDate(this.state.dayLog.currentDate) : formatFullDate(entry.date);
      exportLabel = entry.isToday ? 'Today' : formatShortDate(entry.date);

      doc.setFillColor(...brand);
      doc.rect(0, 0, pageW, 28, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold'); doc.setFontSize(16);
      doc.text('Daily Nutrition Report', margin, 14);
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text(dateLabel, margin, 21);

      let y = 42;
      const rows = [
        ['Calories', `${Math.round(entry.calories)} kcal`, statusFor('calories', entry.calories)],
        ['Protein', `${entry.protein} g`, statusFor('protein', entry.protein)],
        ['Carbs', `${entry.carbs} g`, statusFor('carbs', entry.carbs)],
        ['Fat', `${entry.fat} g`, statusFor('fat', entry.fat)],
        ['Fiber', `${entry.fiber} g`, statusFor('fiber', entry.fiber)],
        ['Sugar', `${entry.sugar} g`, statusFor('sugar', entry.sugar)],
        ['Sodium', `${entry.sodium} mg`, statusFor('sodium', entry.sodium)],
        ['Water', `${formatLiters(entry.waterMl)} L`, statusFor('water', entry.waterMl/1000)],
      ];
      if (entry.weightKg != null) rows.push(['Weight', `${entry.weightKg} kg`, statusFor('weight', entry.weightKg)]);

      rows.forEach(([labelText, value, status]) => {
        doc.setDrawColor(...border);
        doc.line(margin, y+2.5, pageW-margin, y+2.5);
        doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink2);
        doc.text(labelText, margin, y);
        doc.setFont('helvetica','bold'); doc.setTextColor(...ink);
        doc.text(value, pageW-margin-24, y, { align:'right' });
        doc.setFillColor(...statusColorFor(status));
        doc.roundedRect(pageW-margin-20, y-4, 20, 5.5, 1.5, 1.5, 'F');
        doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
        doc.text(statusTextFor(status), pageW-margin-10, y-0.3, { align:'center' });
        y += 9;
      });

      y += 5;
      const macroCals = { protein: entry.protein*4, carbs: entry.carbs*4, fat: entry.fat*9 };
      const macroTotal = Math.max(1, macroCals.protein+macroCals.carbs+macroCals.fat);
      let barX = margin;
      [[protein, macroCals.protein],[carbs, macroCals.carbs],[fat, macroCals.fat]].forEach(([color, val]) => {
        const w = (val/macroTotal)*contentW;
        doc.setFillColor(...color);
        doc.rect(barX, y, w, 6, 'F');
        barX += w;
      });
      y += 11;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...muted);
      doc.text('Macro split — protein / carbs / fat', margin, y);
      y += 12;

      if (entry.isToday && this.state.today.meals.length){
        y = ensureRoom(y, 10);
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...ink);
        doc.text('Meals logged today', margin, y);
        y += 8;
        this.state.today.meals.forEach(meal => {
          y = ensureRoom(y, 8);
          doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...brandDark);
          doc.text(`${meal.name} — ${Math.round(mealKcal(meal))} kcal`, margin, y);
          y += 6;
          meal.items.forEach(item => {
            y = ensureRoom(y, 6);
            doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...ink2);
            doc.text(item.name, margin+4, y, { maxWidth: contentW-40 });
            doc.setFont('helvetica','bold'); doc.setTextColor(...ink);
            doc.text(`${Math.round(item.kcal)} kcal`, pageW-margin, y, { align:'right' });
            y += 5.5;
          });
          y += 3;
        });
      } else if (!entry.isToday){
        y = ensureRoom(y, 8);
        doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...muted);
        doc.text("Item-level detail isn't stored for past days — totals only.", margin, y);
      }

      filename = `nourish-daily-${entry.isToday ? todayISO() : entry.date}.pdf`;
    } else {
      const start = st.offset*7;
      const chunk = realDays.slice(start, start+7);
      if (!chunk.length){ st.dataStatus = 'Nothing logged for this week — nothing to export.'; this.render(); return; }
      const oldest = chunk[chunk.length-1], newest = chunk[0];
      const periodLabel = `${formatShortDate(oldest.date)}–${newest.isToday?'Today':formatShortDate(newest.date)}`;
      exportLabel = periodLabel;

      doc.setFillColor(...brand);
      doc.rect(0, 0, pageW, 28, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold'); doc.setFontSize(16);
      doc.text('Weekly Summary', margin, 14);
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text(`Week of ${periodLabel}`, margin, 21);

      let y = 42;
      const avgCal = Math.round(chunk.reduce((a,d)=>a+d.calories,0)/chunk.length);
      const avgProtein = Math.round((chunk.reduce((a,d)=>a+d.protein,0)/chunk.length)*10)/10;
      const inRange = chunk.filter(d=>statusFor('calories', d.calories)==='good').length;

      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...ink);
      doc.text(`Average calories: ${avgCal} kcal`, margin, y); y += 7;
      doc.text(`Average protein: ${avgProtein} g`, margin, y); y += 7;
      doc.text(`Days in range: ${inRange} / ${chunk.length}`, margin, y); y += 12;

      const cols = [margin, margin+42, margin+80, margin+112, margin+144];
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...ink2);
      ['Day','Calories','Protein','Carbs','Fat'].forEach((h,i) => doc.text(h, cols[i], y));
      y += 3;
      doc.setDrawColor(...border);
      doc.line(margin, y, pageW-margin, y);
      y += 6;

      chunk.slice().reverse().forEach(d => {
        y = ensureRoom(y, 6.5);
        const dayLabel = d.isToday ? 'Today' : `${WEEKDAY_NAMES[dateFromISO(d.date).getDay()].slice(0,3)} ${formatShortDate(d.date)}`;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        doc.text(dayLabel, cols[0], y);
        doc.text(`${Math.round(d.calories)} kcal`, cols[1], y);
        doc.text(`${d.protein} g`, cols[2], y);
        doc.text(`${d.carbs} g`, cols[3], y);
        doc.text(`${d.fat} g`, cols[4], y);
        y += 6.5;
      });

      filename = `nourish-weekly-${oldest.date}-to-${newest.isToday?todayISO():newest.date}.pdf`;
    }

    doc.save(filename);
    const exports = st.recentExports || (st.recentExports = []);
    exports.unshift({
      filename,
      whenISO: new Date().toISOString(),
      label: st.mode === 'day' ? `1-Day Report · ${exportLabel}` : `Weekly Summary · ${exportLabel}`,
    });
    if (exports.length > 10) exports.length = 10;
    st.dataStatus = 'PDF saved ✓ — check your Downloads folder.';
    this.render();
  },
  handleImportFile(inputEl){
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      let data;
      try { data = JSON.parse(e.target.result); }
      catch (err) {
        this.state.exportScreen.dataStatus = "Import failed — that file isn't valid JSON.";
        this.render();
        return;
      }
      if (!data || !data.memory || !data.memory.foods || !data.memory.ingredients || !data.memory.usda){
        this.state.exportScreen.dataStatus = "Import failed — file doesn't look like a Nourish backup.";
        this.render();
        return;
      }
      this.state.memory = data.memory;
      if (Array.isArray(data.boneEntries)) this.state.library.boneEntries = data.boneEntries;
      if (typeof data.waterMl === 'number') this.state.today.waterMl = data.waterMl;
      if (typeof data.weightKg === 'number') this.state.today.weightKg = data.weightKg;
      if (data.targets) this.state.targets = { ...defaultTargets(), ...data.targets };
      if (Array.isArray(data.meals)) this.state.today.meals = data.meals;
      if (Array.isArray(data.history)) this.state.dayHistory = data.history;
      if (data.dayLog && data.dayLog.currentDate) this.state.dayLog = data.dayLog;
      if (Array.isArray(data.recentExports)) this.state.exportScreen.recentExports = data.recentExports;
      this.saveLocal();
      this.state.exportScreen.dataStatus = 'Import complete ✓ — your memory has been replaced with the backup.';
      this.render();
    };
    reader.readAsText(file);
  },
  saveLocal(){
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(this.buildBackupPayload()));
    } catch (e) { /* storage unavailable — app still works, just won't persist */ }
  },
  loadLocal(){
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.memory && data.memory.foods && data.memory.ingredients && data.memory.usda) this.state.memory = data.memory;
      if (Array.isArray(data.boneEntries)) this.state.library.boneEntries = data.boneEntries;
      if (typeof data.waterMl === 'number') this.state.today.waterMl = data.waterMl;
      if (typeof data.weightKg === 'number') this.state.today.weightKg = data.weightKg;
      if (data.targets) this.state.targets = { ...defaultTargets(), ...data.targets };
      if (Array.isArray(data.meals)) this.state.today.meals = data.meals;
      if (Array.isArray(data.history)) this.state.dayHistory = data.history;
      if (data.dayLog && data.dayLog.currentDate) this.state.dayLog = data.dayLog;
      if (Array.isArray(data.recentExports)) this.state.exportScreen.recentExports = data.recentExports;
    } catch (e) { /* ignore corrupt/missing local data */ }
  },

  setDesktopMeal(id){ const d=this.state.desktop; d.openMeal = d.openMeal===id ? null : id; this.render(); },

  render(){
    renderToolbar();
    renderStage();
    this.saveLocal();
  }
};

/* ================= RENDER: STAGE ================= */

let __lastStageKey = null;
function renderStage(){
  const s = App.state;
  const stage = document.getElementById('stage');
  const stageKey = s.view + ':' + s.screen;
  const samePlace = __lastStageKey === stageKey;
  const scrollSelectors = ['.scroll-area', '.d-center', '.d-aside'];
  const prevScroll = samePlace ? scrollSelectors.map(sel => {
    const el = stage.querySelector(sel);
    return el ? el.scrollTop : null;
  }) : null;

  if (s.view === 'desktop'){
    stage.innerHTML = renderDesktop();
  } else {
    let inner;
    if (s.screen === 'today') inner = renderToday();
    else if (s.screen === 'addfood') inner = renderAddFood();
    else if (s.screen === 'library') inner = renderLibrary();
    else if (s.screen === 'history') inner = renderHistory();
    else if (s.screen === 'trends') inner = renderTrends();
    else if (s.screen === 'settings') inner = renderSettings();
    else inner = renderExport();
    stage.innerHTML = `<div class="phone">${inner}</div>`;
  }

  if (prevScroll){
    scrollSelectors.forEach((sel, i) => {
      if (prevScroll[i] == null) return;
      const el = stage.querySelector(sel);
      if (el) el.scrollTop = prevScroll[i];
    });
  }
  __lastStageKey = stageKey;
}

const TODAY_LABELS = { protein:'Protein', carbs:'Carbs', fat:'Fat', fiber:'Fiber', sugar:'Sugar', sodium:'Sodium' };
function buildTodayStats(consumed, expandedStat){
  return Object.keys(TODAY_LABELS).map(id => {
    const key = id === 'protein' ? 'protein' : (id === 'carbs' ? 'carbs' : (id === 'fat' ? 'fat' : (id === 'fiber' ? 'fiber' : (id === 'sugar' ? 'sugar' : 'sodium'))));
    const value = consumed[key];
    const info = targetInfo(id);
    const status = statusFor(id, value);
    return {
      id, label:TODAY_LABELS[id], value:value.toLocaleString(), unit:info.unit, target:info.label,
      status, statusLabel:statusLabelFor(id, value), detail:detailFor(id, value),
      isOpen: expandedStat === id,
    };
  });
}

        </div>`;
    }

        </div>
        ${resultHtml}
        <div style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.4;">Demo dataset of common items using real USDA per-100g values. The full app would query USDA FoodData Central live for any food.</div>
      </div>
      <div id="addfood-list" style="display:flex;flex-direction:column;gap:8px;">
      ${App.state.memory.usda.map(u => `
        <div data-name="${u.name.toLowerCase()}" class="card pad-sm">
          <div style="display:flex;align-items:center;justify-content:space-between;">

              <div style="margin-top:4px;"><span class="pill pill-usda">Verified · ${u.fdc}</span></div>
            </div>
            <div id="kcal-${u.id}" class="num disp" style="font-size:15px;font-weight:800;color:var(--brand-dark);flex-shrink:0;padding-left:8px;">${u.kcalPer100} kcal</div>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:8px;">${detailLine(u)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">

  return `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <button onclick="App.setScreen('today')" style="background:none;border:none;cursor:pointer;color:var(--ink);padding:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="disp" style="font-size:18px;font-weight:800;">Log food</div>
      </div>
      <div class="search">

      </div>
    </div>

    <div class="scroll-area" style="padding:14px 18px 14px 18px;">
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em;">
        ${st.activeTab==='saved' ? 'From your memory' : (st.activeTab==='ingredients' ? 'Raw ingredients · scale by weight' : 'USDA FoodData Central')}
      </div>
      ${list}
    </div>

    <div style="flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:12px 18px 16px 18px;">
      <div style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;">

function memoryConfirmCard(kind, item){
  return `<div class="card pad-sm" style="border-color:var(--critical);">
    <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">Remove &ldquo;${item.name}&rdquo; from memory?</div>
    <div style="display:flex;gap:8px;">
      <button onclick="App.cancelDelete()" style="flex:1;padding:8px 0;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Cancel</button>
      <button onclick="App.confirmDelete('${kind}','${item.id}')" style="flex:1;padding:8px 0;border-radius:8px;background:var(--critical);color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Delete</button>
    </div>
  </div>`;
}
function memoryConfirmMoveCard(kind, item){
  const moveTo = kind === 'foods' ? 'Ingredients' : 'Saved foods';
  return `<div class="card pad-sm" style="border-color:var(--brand);">
    <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">Move &ldquo;${item.name}&rdquo; to ${moveTo}?</div>
    <div style="display:flex;gap:8px;">
      <button onclick="App.cancelMove()" style="flex:1;padding:8px 0;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Cancel</button>
      <button onclick="App.confirmMove('${kind}','${item.id}')" style="flex:1;padding:8px 0;border-radius:8px;background:var(--brand);color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Move</button>
    </div>
  </div>`;
}

/* ---------- Library ---------- */
function renderLibrary(){
  const st = App.state.library;
  const tabs = [['foods','Saved foods'],['ingredients','Ingredients'],['usda','USDA'],['notes','Notes']];
  const ratios = st.boneEntries.map(e => (e.bone/e.total)*100);
  const boneAvg = ratios.length>0 ? (ratios.reduce((a,r)=>a+r,0)/ratios.length).toFixed(1) : '0.0';
  const formHere = k => st.form && st.form.kind === k ? renderMemoryForm(st.form) : '';

  let body = '';
  if (st.activeTab === 'foods'){
    body = `${formHere('foods')}${st.form && st.form.kind==='foods' ? '' : addMemoryButton('foods','Add a saved food')}<div id="lib-list" style="display:flex;flex-direction:column;gap:8px;">
      ${App.state.memory.foods.map(f => {
        if (st.confirmDeleteKey === 'foods:'+f.id) return `<div data-name="${f.name.toLowerCase()}">${memoryConfirmCard('foods', f)}</div>`;
        if (st.confirmMoveKey === 'foods:'+f.id) return `<div data-name="${f.name.toLowerCase()}">${memoryConfirmMoveCard('foods', f)}</div>`;
        const open = st.openId === f.id;
        return `
        <div data-name="${f.name.toLowerCase()}" class="card" style="overflow:hidden;">
          <div class="accordion-head pad-sm" onclick="App.toggleLibraryOpen('${f.id}')">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              ${photoThumb(f)}
              <div style="min-width:0;">
                <div style="font-size:13.5px;font-weight:700;">${f.name}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:1px;">Updated ${f.updated}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;padding-left:8px;">
              <div class="num" style="font-size:13px;font-weight:700;color:var(--ink-2);">${f.kcal} kcal</div>
              ${memoryRowActions('foods', f)}
              <div class="chev ${open?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
          </div>
          ${open ? `
            <div style="padding:0 13px 13px 13px;border-top:1px solid var(--border);">
              <div style="font-size:11px;color:var(--muted);margin:10px 0 6px 0;">${f.recipe}</div>
              <div style="display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:6px;">
                ${macrosArrayFrom(f).map(([l,v]) => `
                  <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;">
                    <div class="num" style="font-size:12.5px;font-weight:700;">${v}</div>
                    <div style="font-size:9.5px;color:var(--muted);margin-top:1px;">${l}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>`;
  } else if (st.activeTab === 'ingredients'){
    body = `${formHere('ingredients')}${st.form && st.form.kind==='ingredients' ? '' : addMemoryButton('ingredients','Add an ingredient')}<div id="lib-list" style="display:flex;flex-direction:column;gap:8px;">
      ${App.state.memory.ingredients.map(ing => {
        if (st.confirmDeleteKey === 'ingredients:'+ing.id) return `<div data-name="${ing.name.toLowerCase()}">${memoryConfirmCard('ingredients', ing)}</div>`;
        if (st.confirmMoveKey === 'ingredients:'+ing.id) return `<div data-name="${ing.name.toLowerCase()}">${memoryConfirmMoveCard('ingredients', ing)}</div>`;
        return `
        <div data-name="${ing.name.toLowerCase()}" class="card pad-sm">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              ${photoThumb(ing)}
              <div style="font-size:13.5px;font-weight:700;">${ing.name}</div>
            </div>
            <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:8px;">
              <div class="pill ${ing.source==='Lab-tested'?'pill-lab':(ing.source==='Per label'?'pill-label':'pill-usda')}">${ing.source}</div>
              ${memoryRowActions('ingredients', ing)}
            </div>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">${detailLine(ing)}</div>
        </div>`;
      }).join('')}
    </div>`;
  } else if (st.activeTab === 'usda'){
    body = `
      <div style="background:var(--usda-tint);border-radius:11px;padding:10px 12px;margin-bottom:10px;font-size:11.5px;color:var(--brand-dark);line-height:1.4;">
        Used for unlabeled/generic foods — apply these exact figures consistently.
      </div>
      ${formHere('usda')}${st.form && st.form.kind==='usda' ? '' : addMemoryButton('usda','Add a reference item')}
      <div id="lib-list" style="display:flex;flex-direction:column;gap:8px;">
        ${App.state.memory.usda.map(u => {
          if (st.confirmDeleteKey === 'usda:'+u.id) return `<div data-name="${u.name.toLowerCase()}">${memoryConfirmCard('usda', u)}</div>`;
          return `
          <div data-name="${u.name.toLowerCase()}" class="card pad-sm">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                ${photoThumb(u)}
                <div style="font-size:13.5px;font-weight:700;">${u.name}</div>
              </div>
              <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:8px;">
                <div class="pill pill-usda">${u.fdc}</div>
                ${memoryRowActions('usda', u)}
              </div>
            </div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">${detailLine(u)}</div>
          </div>`;
        }).join('')}
      </div>`;
  } else {
    body = `
      <div style="background:var(--note-bg);border:1px solid var(--note-border);border-radius:14px;padding:14px;margin-bottom:10px;">
        <div style="font-size:13px;font-weight:800;margin-bottom:4px;">Bone-to-total-weight ratio</div>
        <div style="font-size:11.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.4;">Running average from weighed bone-in chicken &amp; mutton. Add a new data point to update it.</div>
        <div class="num disp" style="font-size:26px;font-weight:800;color:var(--brand-dark);">${boneAvg}%</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">across ${st.boneEntries.length} weighed entries</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="bone-total-input" type="number" placeholder="Total g" style="width:0;flex:1;text-align:left;"/>
          <input id="bone-bone-input" type="number" placeholder="Bone g" style="width:0;flex:1;text-align:left;"/>
          <button onclick="App.addBoneEntry()" style="flex-shrink:0;padding:8px 12px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">Add</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${RULE_NOTES.map(rn => `
          <div class="card pad-sm">
            <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">${rn.title}</div>
            <div style="font-size:11.5px;color:var(--ink-2);line-height:1.45;">${rn.body}</div>
          </div>
        `).join('')}
      </div>`;
  }

  return `
    <div class="topbar">
      <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:2px;">Memory &amp; library</div>
      <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:12px;">Saved foods, ingredients &amp; learned rules — update anytime</div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input placeholder="Search memory..." oninput="App.filterRows('lib-list', this.value)" ${st.activeTab==='notes'?'disabled style="opacity:.5;"':''}/>
      </div>
      <div class="seg" style="margin-top:12px;overflow-x:auto;">
        ${tabs.map(([id,label]) => `<button class="seg-btn" style="flex-shrink:0;${st.activeTab===id?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setLibraryTab('${id}')">${label}</button>`).join('')}
      </div>
    </div>
    <div class="scroll-area" style="padding:14px 18px 90px 18px;">${body}</div>
    ${bottomNav('library')}
  `;
}

/* ---------- History ---------- */
function renderHistory(){
  const st = App.state.history;
  const views = [['day','Day'],['week','Week'],['month','Month']];
  const realDays = App.allRealDays(); // most-recent-first, today included

  let body = '';
  if (st.view === 'day'){
    body = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${realDays.map((d,i) => {
          const label = d.isToday ? 'Today' : formatShortDate(d.date);
          const open = st.openIdx === i;
          return `
          <div class="card" style="overflow:hidden;">
            <div class="accordion-head pad-sm" onclick="App.toggleHistoryRow(${i})">
              <div>
                <div style="font-size:13.5px;font-weight:700;">${label}</div>
                <div style="display:flex;gap:5px;margin-top:6px;">
                  <div class="dot" style="background:${dotColor(statusFor('calories', d.calories)==='good')};"></div>
                  <div class="dot" style="background:${dotColor(statusFor('protein', d.protein)==='good')};"></div>
                  <div class="dot" style="background:${dotColor(statusFor('fiber', d.fiber)==='good')};"></div>
                  <div class="dot" style="background:${dotColor(statusFor('sugar', d.sugar)==='good')};"></div>
                </div>
              </div>
              <div class="num disp" style="font-size:15px;font-weight:800;">${Math.round(d.calories)} <span style="font-size:11px;font-weight:600;color:var(--muted);">kcal</span></div>
            </div>
            ${open ? `
              <div style="padding:0 13px 12px 13px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:6px;margin-top:10px;">
                <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${d.protein}g</div><div style="font-size:9.5px;color:var(--muted);">Protein</div></div>
                <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${d.fiber}g</div><div style="font-size:9.5px;color:var(--muted);">Fiber</div></div>
                <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${d.sugar}g</div><div style="font-size:9.5px;color:var(--muted);">Sugar</div></div>
                <div style="background:var(--surface);border-radius:8px;padding:6px 4px;text-align:center;"><div class="num" style="font-size:12.5px;font-weight:700;">${Math.round(d.calories)}</div><div style="font-size:9.5px;color:var(--muted);">Calories</div></div>
              </div>
            ` : ''}
          </div>`;
        }).join('')}
      </div>
      ${realDays.length <= 1 ? `<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5;">This fills in day by day as you log — check back tomorrow.</div>` : ''}`;
  } else if (st.view === 'week'){
    const chunks = [];
    for (let i=0; i<realDays.length; i+=7) chunks.push(realDays.slice(i, i+7));
    body = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${chunks.map((days, w) => {
          const nDays = days.length;
          const avgCal = Math.round(days.reduce((a,d)=>a+d.calories,0)/nDays);
          const avgProtein = Math.round((days.reduce((a,d)=>a+d.protein,0)/nDays)*10)/10;
          const avgFiber = Math.round((days.reduce((a,d)=>a+d.fiber,0)/nDays)*10)/10;
          const inRange = days.filter(d=>statusFor('calories', d.calories)==='good').length;
          const oldest = days[days.length-1], newest = days[0];
          const label = w===0 ? `This week so far (${formatShortDate(oldest.date)}–${newest.isToday?'Today':formatShortDate(newest.date)})` : `${formatShortDate(oldest.date)}–${formatShortDate(newest.date)}`;
          return `
          <div class="card pad-sm">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <div style="font-size:13.5px;font-weight:700;">${label}</div>
              <div class="pill" style="background:var(--brand-tint);color:var(--brand-dark);">${inRange}/${nDays} in range</div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px;">
              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:15px;font-weight:800;">${avgCal}</div><div style="font-size:9.5px;color:var(--muted);">avg kcal</div></div>
              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:15px;font-weight:800;">${avgProtein}g</div><div style="font-size:9.5px;color:var(--muted);">avg protein</div></div>
              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:15px;font-weight:800;">${avgFiber}g</div><div style="font-size:9.5px;color:var(--muted);">avg fiber</div></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${realDays.length < 7 ? `<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5;">Averaging over ${realDays.length} logged day${realDays.length===1?'':'s'} so far — this fills in as you go.</div>` : ''}`;
  } else {
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstWeekday = new Date(year, month, 1).getDay();
    const byDate = new Map(realDays.map(d => [d.date, d]));
    const todayIso = App.state.dayLog.currentDate;
    let cells = '';
    for (let pad=0; pad<firstWeekday; pad++) cells += `<div></div>`;
    for (let day=1; day<=daysInMonth; day++){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isSelected = st.selectedDayNum === day;
      const ring = isSelected ? 'outline:2px solid var(--brand-dark);outline-offset:-2px;' : '';
      const entry = byDate.get(iso);
      if (iso === todayIso && !entry){
        cells += `<div onclick="App.selectMonthDay(${day})" style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#EEEEEC;color:var(--ink-2);font-size:11px;font-weight:700;cursor:pointer;${ring}">${day}</div>`;
      } else if (!entry){
        cells += `<div style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#C3C2B7;font-size:11px;font-weight:700;">${day}</div>`;
      } else {
        const good = statusFor('calories', entry.calories)==='good';
        const bg = !good ? 'var(--critical-tint)' : 'var(--good-tint)';
        const color = !good ? 'var(--critical)' : 'var(--good)';
        cells += `<div onclick="App.selectMonthDay(${day})" style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;background:${bg};color:${color};font-size:11px;font-weight:700;cursor:pointer;${ring}">${day}</div>`;
      }
    }
    let selectedPanel = '';
    if (st.selectedDayNum){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(st.selectedDayNum).padStart(2,'0')}`;
      const entry = byDate.get(iso);
      if (!entry){
        selectedPanel = `<div class="card pad-sm" style="background:var(--brand-tint);border:none;margin-bottom:10px;"><div style="font-size:12.5px;font-weight:700;color:var(--brand-dark);">${formatShortDate(iso)} — nothing logged</div></div>`;
      } else {
        selectedPanel = `<div class="card pad-sm" style="background:var(--brand-tint);border:none;margin-bottom:10px;">
          <div style="font-size:12.5px;font-weight:700;color:var(--brand-dark);margin-bottom:6px;">${entry.isToday ? 'Today' : formatShortDate(iso)}</div>
          <div style="font-size:11.5px;color:var(--brand-dark);">${Math.round(entry.calories)} kcal · ${entry.protein}g protein · ${entry.fiber}g fiber</div>
        </div>`;
      }
    }
    body = `
      <div style="font-size:13.5px;font-weight:700;margin-bottom:10px;">${MONTH_NAMES[month]} ${year}</div>
      ${selectedPanel}
      <div style="display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:6px;margin-bottom:12px;">
        ${['S','M','T','W','T','F','S'].map(l=>`<div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;">${l}</div>`).join('')}
        ${cells}
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);"><div class="dot" style="background:var(--good);"></div>On track</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);"><div class="dot" style="background:var(--critical);"></div>Over ceiling</div>
      </div>`;
  }

  return `
    <div class="topbar">
      <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">History</div>
      <div class="seg">
        ${views.map(([id,label]) => `<button class="seg-btn" style="flex:1;${st.view===id?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setHistoryView('${id}')">${label}</button>`).join('')}
      </div>
    </div>
    <div class="scroll-area" style="padding:14px 18px 90px 18px;">${body}</div>
    ${bottomNav('history')}
  `;
}

/* ---------- Trends ---------- */
const TREND_CATS = [
  { id:'calories', label:'Calories', decimals:0 },
  { id:'protein', label:'Protein', decimals:1 },
  { id:'carbs', label:'Carbs', decimals:1 },
  { id:'fat', label:'Fat', decimals:1 },
  { id:'fiber', label:'Fiber', decimals:1 },
  { id:'sugar', label:'Sugar', decimals:1 },
  { id:'sodium', label:'Sodium', decimals:0 },
  { id:'water', label:'Water', decimals:2 },
  { id:'weight', label:'Weight', decimals:1 },
];
function renderTrends(){
  const st = App.state.trends;
  const cat = TREND_CATS.find(c=>c.id===st.activeCat) || TREND_CATS[0];
  const t = App.state.targets[cat.id];
  const unit = t.unit;
  const rangeDefs = [['7d','7D',7],['30d','30D',30],['90d','90D',90]];
  const rd = rangeDefs.find(r=>r[0]===st.range) || rangeDefs[0];
  const n = rd[2];

  const realDays = App.allRealDays();
  const valueForDay = (d) => {
    if (cat.id === 'weight') return typeof d.weightKg === 'number' ? d.weightKg : null;
    if (cat.id === 'water') return Math.round((d.waterMl/1000)*100)/100;
    return d[cat.id];
  };
  const windowed = realDays.slice(0, n);
  const series = windowed.map(d => ({ date:d.date, isToday:d.isToday, v: valueForDay(d) })).filter(p => p.v !== null).reverse();

  const catChips = `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
    ${TREND_CATS.map(c => `<button class="chip ${st.activeCat===c.id?'active':''}" onclick="App.setTrendCat('${c.id}')">${c.label}</button>`).join('')}
  </div>`;
  const rangeTabs = `<div class="seg" style="margin-bottom:14px;box-shadow:none;border:1px solid var(--border);">
    ${rangeDefs.map(([id,label]) => `<button class="seg-btn" style="flex:1;${st.range===id?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setTrendRange('${id}')">${label}</button>`).join('')}
  </div>`;

  if (series.length < 2){
    return `
      <div class="topbar">
        <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">Trends</div>
        ${catChips}
      </div>
      <div class="scroll-area" style="padding:16px 18px 90px 18px;">
        ${rangeTabs}
        <div class="card pad" style="text-align:center;color:var(--muted);font-size:13px;line-height:1.6;padding:36px 20px;">
          Not enough data yet for a ${cat.label.toLowerCase()} trend.<br/>Keep logging — this fills in once you have at least two days.
        </div>
      </div>
      ${bottomNav('trends')}
    `;
  }

  const values = series.map(p=>p.v);
  const targetLow = t.kind==='range' ? t.low : (t.kind==='floor' ? t.value : null);
  const targetHigh = t.kind==='range' ? t.high : (t.kind==='ceiling' ? t.value : null);
  const boundCandidates = values.concat([targetLow, targetHigh].filter(v=>v!=null));
  let domainMin = Math.min(...boundCandidates);
  let domainMax = Math.max(...boundCandidates);
  if (domainMin === domainMax){ domainMin -= 1; domainMax += 1; }
  const padAmt = (domainMax - domainMin) * 0.15;
  domainMin = Math.max(0, domainMin - padAmt);
  domainMax = domainMax + padAmt;

  const trendStatusFor = (v) => statusFor(cat.id, v);
  const colorFor = (s) => s==='good' ? 'var(--good)' : (s==='warning' ? 'var(--warning)' : 'var(--critical)');

  const plotTop=10, plotBottom=146, plotH=plotBottom-plotTop;
  const yFor = (v) => plotBottom - ((v-domainMin)/(domainMax-domainMin))*plotH;
  const m = series.length;
  const xFor = (k) => m===1 ? 171 : (k/(m-1))*342;
  const linePath = series.map((s,k) => `${k===0?'M':'L'} ${xFor(k).toFixed(1)},${yFor(s.v).toFixed(1)}`).join(' ');

  let bandLow,bandHigh,bandLabel;
  if (t.kind==='range'){ bandLow=t.low; bandHigh=t.high; bandLabel=`Target ${t.low}–${t.high}${unit}`; }
  else if (t.kind==='ceiling'){ bandLow=domainMin; bandHigh=t.value; bandLabel=`Under ${t.value}${unit}`; }
  else { bandLow=t.value; bandHigh=domainMax; bandLabel=`At least ${t.value}${unit}`; }
  const bandY = yFor(bandHigh);
  const bandH = Math.max(2, yFor(bandLow)-yFor(bandHigh));

  const showPoints = m<=14;
  const points = series.map((s,k) => ({x:xFor(k).toFixed(1), y:yFor(s.v).toFixed(1), color:colorFor(trendStatusFor(s.v)), k}));

  let tooltip = '';
  if (st.activePoint!==null && series[st.activePoint]){
    const s = series[st.activePoint];
    const label = s.isToday ? 'Today' : formatShortDate(s.date);
    const left = xFor(st.activePoint);
    const top = yFor(s.v)-34;
    tooltip = `<div style="position:absolute;background:var(--brand-dark);color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;left:${left}px;top:${top}px;white-space:nowrap;transform:translateX(-50%);z-index:2;">${label} · ${s.v}${unit}</div>`;
  }

  const avg = values.reduce((a,v)=>a+v,0)/values.length;
  const avgValue = `${Math.round(avg*Math.pow(10,cat.decimals))/Math.pow(10,cat.decimals)}${unit}`;
  const pctInRange = Math.round((series.filter(s=>trendStatusFor(s.v)==='good').length/series.length)*100);
  const ideal = t.kind==='range' ? (t.low+t.high)/2 : (t.kind==='ceiling' ? t.value*0.85 : t.value*1.15);
  let bestIdx=0, bestDist=Infinity;
  series.forEach((s,k)=>{ const dist=Math.abs(s.v-ideal); if (dist<bestDist){bestDist=dist; bestIdx=k;} });
  const bestSeries = series[bestIdx];
  const bestValue = `${bestSeries.v}${unit}`;
  const bestLabel = bestSeries.isToday ? 'today' : formatShortDate(bestSeries.date);

  return `
    <div class="topbar">
      <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">Trends</div>
      ${catChips}
    </div>
    <div class="scroll-area" style="padding:16px 18px 90px 18px;">
      ${rangeTabs}
      <div class="card pad" style="position:relative;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-2);">${cat.label} · ${series.length} day${series.length===1?'':'s'} logged</div>
          <div style="font-size:11px;color:var(--muted);">${bandLabel}</div>
        </div>
        ${tooltip}
        <svg viewBox="0 0 342 176" width="100%" height="176" style="overflow:visible;margin-top:6px;">
          <rect x="0" y="${bandY.toFixed(1)}" width="342" height="${bandH.toFixed(1)}" fill="rgba(28,92,75,0.10)" rx="4"/>
          <line x1="0" y1="146" x2="342" y2="146" stroke="#e1e0d9" stroke-width="1"/>
          <path d="${linePath}" fill="none" stroke="var(--protein)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${showPoints ? points.map(pt => `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="${pt.color}" stroke="#fff" stroke-width="2" style="cursor:pointer;" onclick="App.selectTrendPoint(${pt.k})"/>`).join('') : ''}
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:4px;">
          <div style="font-size:10.5px;color:var(--muted);">${series[0].isToday ? 'Today' : formatShortDate(series[0].date)}</div>
          <div style="font-size:10.5px;color:var(--muted);">${series[series.length-1].isToday ? 'Today' : formatShortDate(series[series.length-1].date)}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px;margin-top:14px;">
        <div class="card" style="padding:12px 8px;text-align:center;"><div class="num disp" style="font-size:17px;font-weight:800;">${avgValue}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Average</div></div>
        <div class="card" style="padding:12px 8px;text-align:center;"><div class="num disp" style="font-size:17px;font-weight:800;color:var(--brand-dark);">${pctInRange}%</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Days in range</div></div>
        <div class="card" style="padding:12px 8px;text-align:center;"><div class="num disp" style="font-size:17px;font-weight:800;">${bestValue}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Best day (${bestLabel})</div></div>
      </div>
    </div>
    ${bottomNav('trends')}
  `;
}

/* ---------- Export ---------- */
function renderExport(){
  const st = App.state.exportScreen;
  const realDays = App.allRealDays();

  let periodLabel='', tagLabel='', tagClass='var(--muted)', fullDateLabel='';
  let entry = null, weekChunk = null;
  const maxOffset = st.mode === 'day' ? Math.max(0, realDays.length-1) : Math.max(0, Math.ceil(realDays.length/7)-1);

  if (st.mode === 'day'){
    entry = realDays[st.offset] || null;
    if (entry){
      periodLabel = entry.isToday ? 'Today' : formatShortDate(entry.date);
      fullDateLabel = entry.isToday ? formatFullDate(App.state.dayLog.currentDate) : formatFullDate(entry.date);
      tagLabel = entry.isToday ? "Today's data so far" : 'Logged day';
      tagClass = entry.isToday ? 'var(--warning)' : 'var(--good)';
    }
  } else {
    const start = st.offset*7;
    const chunk = realDays.slice(start, start+7);
    if (chunk.length){
      weekChunk = chunk;
      const oldest = chunk[chunk.length-1], newest = chunk[0];
      periodLabel = `${formatShortDate(oldest.date)}–${newest.isToday?'Today':formatShortDate(newest.date)}`;
      fullDateLabel = `Week of ${periodLabel}`;
      tagLabel = `${chunk.length} day${chunk.length===1?'':'s'} logged`;
      tagClass = 'var(--brand-dark)';
    }
  }

  let preview;
  if (st.mode === 'day'){
    if (!entry){
      preview = `<div class="card pad" style="text-align:center;color:var(--muted);font-size:13px;padding:30px 16px;margin-bottom:16px;">Nothing logged for this day.</div>`;
    } else {
      const rows = [
        ['Calories', Math.round(entry.calories)+' kcal', statusFor('calories', entry.calories)==='good'],
        ['Protein', entry.protein+' g', statusFor('protein', entry.protein)==='good'],
        ['Fiber', entry.fiber+' g', statusFor('fiber', entry.fiber)==='good'],
        ['Sugar', entry.sugar+' g', statusFor('sugar', entry.sugar)==='good'],
      ];
      const macroCals = { protein: entry.protein*4, carbs: entry.carbs*4, fat: entry.fat*9 };
      const macroTotal = Math.max(1, macroCals.protein+macroCals.carbs+macroCals.fat);
      const pPct = Math.round(macroCals.protein/macroTotal*100), cPct = Math.round(macroCals.carbs/macroTotal*100), fPct = Math.round(macroCals.fat/macroTotal*100);
      preview = `
        <div style="background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(11,11,11,0.06);margin-bottom:16px;">
          <div style="background:var(--brand);padding:14px 16px;color:#fff;">
            <div class="disp" style="font-size:14px;font-weight:800;">Daily Nutrition Report</div>
            <div style="font-size:10.5px;opacity:0.8;margin-top:2px;">${fullDateLabel}</div>
          </div>
          <div style="padding:12px 16px;">
            ${rows.map(([label,value,ok]) => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                <div style="font-size:11.5px;font-weight:600;color:var(--ink-2);">${label}</div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <div class="num" style="font-size:12px;font-weight:700;">${value}</div>
                  <div class="pill ${ok?'pill-good':'pill-warn'}">${ok?'OK':'CHECK'}</div>
                </div>
              </div>
            `).join('')}
            <div style="height:10px;border-radius:5px;overflow:hidden;display:flex;margin-top:10px;">
              <div style="width:${pPct}%;background:var(--protein);"></div><div style="width:${cPct}%;background:var(--carbs);"></div><div style="width:${fPct}%;background:var(--fat);"></div>
            </div>
            <div style="font-size:9.5px;color:var(--muted);margin-top:5px;">Macro split · protein / carbs / fat</div>
          </div>
        </div>`;
    }
  } else {
    if (!weekChunk){
      preview = `<div class="card pad" style="text-align:center;color:var(--muted);font-size:13px;padding:30px 16px;margin-bottom:16px;">Nothing logged for this week.</div>`;
    } else {
      const maxCal = Math.max(1900, ...weekChunk.map(d=>d.calories));
      const avgCal = Math.round(weekChunk.reduce((a,d)=>a+d.calories,0)/weekChunk.length);
      const avgProtein = Math.round((weekChunk.reduce((a,d)=>a+d.protein,0)/weekChunk.length)*10)/10;
      const inRange = weekChunk.filter(d=>statusFor('calories', d.calories)==='good').length;
      const chron = weekChunk.slice().reverse();
      preview = `
        <div style="background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(11,11,11,0.06);margin-bottom:16px;">
          <div style="background:var(--brand);padding:14px 16px;color:#fff;">
            <div class="disp" style="font-size:14px;font-weight:800;">Weekly Summary</div>
            <div style="font-size:10.5px;opacity:0.8;margin-top:2px;">${fullDateLabel}</div>
          </div>
          <div style="padding:14px 16px;">
            <div style="display:flex;align-items:flex-end;gap:5px;height:70px;margin-bottom:8px;">
              ${chron.map(d => {
                const h = Math.max(6, Math.round((d.calories/maxCal)*64));
                const c = d.isToday ? 'var(--brand)' : (statusFor('calories', d.calories)==='good' ? '#8FBFAE' : '#eda1a1');
                const wl = WEEKDAY_NAMES[dateFromISO(d.date).getDay()].slice(0,1);
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;border-radius:4px 4px 0 0;background:${c};height:${h}px;"></div><div style="font-size:8.5px;color:var(--muted);">${wl}</div></div>`;
              }).join('')}
            </div>
            <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px;">
              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:14px;font-weight:800;">${avgCal}</div><div style="font-size:9px;color:var(--muted);">avg kcal</div></div>
              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:14px;font-weight:800;">${avgProtein}g</div><div style="font-size:9px;color:var(--muted);">avg protein</div></div>
              <div style="background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;"><div class="num disp" style="font-size:14px;font-weight:800;">${inRange}/${weekChunk.length}</div><div style="font-size:9px;color:var(--muted);">in range</div></div>
            </div>
          </div>
        </div>`;
    }
  }

  const canGoOlder = st.offset < maxOffset;
  const canGoNewer = st.offset > 0;

  return `
    <div class="topbar">
      <div class="disp" style="font-size:20px;font-weight:800;margin-bottom:12px;">Export</div>
      <div class="seg">
        <button class="seg-btn" style="flex:1;${st.mode==='day'?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setExportMode('day')">1-Day Report</button>
        <button class="seg-btn" style="flex:1;${st.mode==='week'?'background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,11,11,0.10);':''}" onclick="App.setExportMode('week')">Weekly Summary</button>
      </div>
    </div>
    <div class="scroll-area" style="padding:16px 18px 90px 18px;">
      <div class="card pad-sm" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <button onclick="App.stepExport(1)" ${canGoOlder?'':'disabled'} style="width:30px;height:30px;border-radius:8px;background:var(--surface);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:${canGoOlder?'1':'0.35'};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div style="text-align:center;">
          <div style="font-size:13.5px;font-weight:700;">${periodLabel || '—'}</div>
          <div style="font-size:10.5px;color:${tagClass};font-weight:600;">${tagLabel || 'No data'}</div>
        </div>
        <button onclick="App.stepExport(-1)" ${canGoNewer?'':'disabled'} style="width:30px;height:30px;border-radius:8px;background:var(--surface);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:${canGoNewer?'1':'0.35'};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      ${preview}
      <button onclick="App.exportPdf()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0;border-radius:13px;background:var(--brand);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:20px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18v1a1 1 0 001 1h12a1 1 0 001-1v-1" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        Export PDF
      </button>
      <div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px;">Recent exports</div>
      ${st.recentExports && st.recentExports.length ? `
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:22px;">
          ${st.recentExports.map(e => `
            <div class="card pad-sm" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div style="min-width:0;">
                <div style="font-size:12.5px;font-weight:700;">${e.label}</div>
                <div style="font-size:10.5px;color:var(--muted);margin-top:1px;">${e.filename}</div>
              </div>
              <div style="font-size:10px;color:var(--muted);flex-shrink:0;">${new Date(e.whenISO).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>
            </div>
          `).join('')}
        </div>
      ` : `<div style="text-align:center;color:var(--muted);font-size:12px;padding:10px 0 22px 0;">No reports exported yet.</div>`}

      <div class="card pad" style="margin-bottom:10px;">
        <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">Import a backup</div>
        <label style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 0;border-radius:11px;border:1.5px dashed rgba(11,11,11,0.22);color:var(--ink-2);font-size:12.5px;font-weight:700;cursor:pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 20V9m0 0l-4 4m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 6V5a1 1 0 011-1h12a1 1 0 011 1v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Choose backup file (.json)
          <input type="file" accept="application/json,.json" style="display:none;" onchange="App.handleImportFile(this)"/>

      </div>
      ${st.dataStatus ? `<div style="text-align:center;font-size:12px;font-weight:700;color:var(--brand-dark);margin-bottom:10px;">${st.dataStatus}</div>` : ''}
      <div style="font-size:10px;color:var(--muted);line-height:1.4;">Nothing here ever leaves this device on its own — export only sends data where you choose to save it.</div>
    </div>
    ${bottomNav('exportScreen')}
  `;
}

/* ---------- Settings ---------- */
function settingsCard(id, label){
  const t = App.state.targets[id];
  let inputsHtml;
  if (t.kind === 'range'){
    inputsHtml = `
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="set-${id}-low" type="number" step="0.1" value="${t.low}" style="flex:1;text-align:left;"/>
        <div style="color:var(--muted);font-size:12px;flex-shrink:0;">to</div>
        <input id="set-${id}-high" type="number" step="0.1" value="${t.high}" style="flex:1;text-align:left;"/>
        <div style="color:var(--muted);font-size:12px;flex-shrink:0;">${t.unit}</div>
      </div>`;
  } else if (t.kind === 'ceiling'){
    inputsHtml = `
      <div style="display:flex;gap:8px;align-items:center;">
        <div style="color:var(--muted);font-size:12px;flex-shrink:0;">Under</div>
        <input id="set-${id}-value" type="number" step="0.1" value="${t.value}" style="flex:1;text-align:left;"/>
        <div style="color:var(--muted);font-size:12px;flex-shrink:0;">${t.unit}</div>
      </div>`;
  } else {
    inputsHtml = `
      <div style="display:flex;gap:8px;align-items:center;">
        <div style="color:var(--muted);font-size:12px;flex-shrink:0;">At least</div>
        <input id="set-${id}-value" type="number" step="0.1" value="${t.value}" style="flex:1;text-align:left;"/>
        <div style="color:var(--muted);font-size:12px;flex-shrink:0;">${t.unit}</div>

  }
  return `
    <div class="card pad-sm" style="margin-bottom:8px;">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">${label}</div>
      ${inputsHtml}
    </div>`;
}

    </div>

      <div style="display:flex;gap:8px;">
        <button onclick="App.resetTargets()" style="flex:1;padding:12px 0;border-radius:12px;background:var(--surface);color:var(--ink-2);border:1px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">Reset defaults</button>
        <button onclick="App.saveTargets()" style="flex:2;padding:12px 0;border-radius:12px;background:var(--brand);color:#fff;border:none;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;">Save changes</button>
      </div>
    </div>
  `;
}

/* ---------- Desktop dashboard ---------- */
function renderDesktop(){
  const dt = App.state.today;
  const dd = App.state.desktop;
  const consumed = computeConsumedTotals(dt.meals);
  const targetMl = targetInfo('water').high * 1000;
  const waterPct = Math.min(100, Math.round((dt.waterMl/targetMl)*100));
  const waterL = formatLiters(dt.waterMl);
  const waterGood = statusFor('water', dt.waterMl/1000) === 'good';

  const navDefs = ['Today','History','Trends','Library','Export'];
  const macroCals = { protein: consumed.protein*4, carbs: consumed.carbs*4, fat: consumed.fat*9 };
  const macroTotal = Math.max(1, macroCals.protein + macroCals.carbs + macroCals.fat);
  const macroPct = {
    protein: Math.round(macroCals.protein/macroTotal*100),
    carbs: Math.round(macroCals.carbs/macroTotal*100),
    fat: Math.round(macroCals.fat/macroTotal*100),
  };
  const realDaysDesktop = App.allRealDays();
  function buildSpark(catId, bandLow, bandHigh){
    const series = realDaysDesktop.slice(0,7).map(d => d[catId]).reverse();
    if (series.length < 2) return null;
    const targetVals = [bandLow, bandHigh].filter(v=>v!=null);
    let min = Math.min(...series, ...targetVals), max = Math.max(...series, ...targetVals);
    if (min===max){ min-=1; max+=1; }
    const padAmt = (max-min)*0.15;
    min = Math.max(0, min-padAmt); max = max+padAmt;
    const yFor = (v) => 60 - ((v-min)/(max-min))*55;
    const n = series.length;
    const path = series.map((v,k) => `${k===0?'M':'L'} ${(n===1?130:(k/(n-1)*260)).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    const avg = Math.round((series.reduce((a,v)=>a+v,0)/n)*10)/10;
    return {path, bandY:yFor(bandHigh).toFixed(1), bandH:Math.max(2,(yFor(bandLow)-yFor(bandHigh))).toFixed(1), avg, count:n};
  }
  const calT = App.state.targets.calories, protT = App.state.targets.protein;
  const calSpark = buildSpark('calories', calT.value*0.9, calT.value);
  const protSpark = buildSpark('protein', protT.low, protT.high);

  const savedShortcuts = [
    ['Usual Breakfast','359 kcal'], ['Chapati, 90g','213 kcal'], ['Caramel Coffee','251 kcal'],
    ['Plain Greek Yogurt /100g','63 kcal'], ['Home Made Sweet Corn /200g','293 kcal'],
  ];

  return `
    <div class="desktop">
      <div class="d-sidebar">
        <div style="display:flex;align-items:center;gap:10px;padding:0 24px 28px 24px;">
          <div style="width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-9C1 8 3 4 7 4c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 4 0 6 4 4.5 8-2.5 4.65-9.5 9-9.5 9z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </div>
          <div class="disp" style="font-size:16px;font-weight:800;">Nourish</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;padding:0 12px;">
          ${navDefs.map((label,idx) => `<div class="d-nav-item ${idx===0?'active':''}">${label}</div>`).join('')}
        </div>
        <div style="margin-top:auto;padding:0 24px;display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">A</div>
          <div style="font-size:12.5px;font-weight:600;opacity:0.85;">Ahmed · Al Ain, UAE</div>
        </div>
      </div>

      <div class="d-center">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
          <div>
            <div class="disp" style="font-size:24px;font-weight:800;">Good morning, Ahmed</div>
            <div style="font-size:13.5px;color:var(--ink-2);margin-top:3px;">${formatFullDate(App.state.dayLog.currentDate)} · today's intake so far</div>
          </div>
          <button onclick="App.setView('mobile'); App.setScreen('addfood')" style="display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:11px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;border:none;cursor:pointer;font-family:inherit;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
            Log food
          </button>
        </div>

        <div class="d-stat-row" style="margin-bottom:20px;">
          ${[
            ['Calories', consumed.calories, 'calories'],
            ['Protein', consumed.protein, 'protein'],
            ['Carbs', consumed.carbs, 'carbs'],
            ['Fat', consumed.fat, 'fat'],
            ['Fiber', consumed.fiber, 'fiber'],
            ['Sugar', consumed.sugar, 'sugar'],
            ['Sodium', consumed.sodium, 'sodium'],
          ].map(([label,rawValue,id]) => {
            const info = targetInfo(id);
            const s = statusFor(id, rawValue);
            const color = s==='good' ? 'var(--good)' : (s==='warning' ? 'var(--warning)' : 'var(--critical)');
            return [label, rawValue.toLocaleString(), info.unit, info.label, color];
          }).map(([label,value,unit,target,color]) => `
            <div class="d-stat">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                <div style="font-size:11px;color:var(--ink-2);font-weight:700;">${label}</div>
                <div class="dot" style="width:7px;height:7px;background:${color};"></div>
              </div>
              <div class="num disp" style="font-size:17px;font-weight:800;">${value}<span style="font-size:10.5px;font-weight:600;color:var(--ink-2);"> ${unit}</span></div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px;">${target}</div>
            </div>
          `).join('')}
        </div>

        <div style="display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:12px;margin-bottom:20px;">
          <div class="card pad">
            <div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px;">Calories · trend</div>
            ${calSpark ? `
              <svg viewBox="0 0 260 70" width="100%" height="70">
                <rect x="0" y="${calSpark.bandY}" width="260" height="${calSpark.bandH}" fill="rgba(28,92,75,0.10)" rx="3"/>
                <path d="${calSpark.path}" fill="none" stroke="var(--protein)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <div style="font-size:11px;color:var(--muted);margin-top:4px;">avg ${calSpark.avg} kcal over ${calSpark.count} days · target &lt; ${calT.value.toLocaleString()}</div>
            ` : `<div style="height:70px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:0 10px;">Not enough data yet</div>`}
          </div>
          <div class="card pad">
            <div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px;">Protein · trend</div>
            ${protSpark ? `
              <svg viewBox="0 0 260 70" width="100%" height="70">
                <rect x="0" y="${protSpark.bandY}" width="260" height="${protSpark.bandH}" fill="rgba(28,92,75,0.10)" rx="3"/>
                <path d="${protSpark.path}" fill="none" stroke="var(--protein)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <div style="font-size:11px;color:var(--muted);margin-top:4px;">avg ${protSpark.avg}g over ${protSpark.count} days · target ${protT.low}–${protT.high}g</div>
            ` : `<div style="height:70px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:0 10px;">Not enough data yet</div>`}
          </div>
          <div class="card pad">
            <div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:10px;">Macro split</div>
            <div style="height:12px;border-radius:6px;overflow:hidden;display:flex;">
              <div style="width:${macroPct.protein}%;background:var(--protein);"></div><div style="width:${macroPct.carbs}%;background:var(--carbs);"></div><div style="width:${macroPct.fat}%;background:var(--fat);"></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;margin-top:10px;">
              <div style="display:flex;justify-content:space-between;font-size:11.5px;"><span style="color:var(--ink-2);">● Protein</span><span class="num" style="font-weight:700;">${macroPct.protein}%</span></div>
              <div style="display:flex;justify-content:space-between;font-size:11.5px;"><span style="color:var(--ink-2);">● Carbs</span><span class="num" style="font-weight:700;">${macroPct.carbs}%</span></div>
              <div style="display:flex;justify-content:space-between;font-size:11.5px;"><span style="color:var(--ink-2);">● Fat</span><span class="num" style="font-weight:700;">${macroPct.fat}%</span></div>
            </div>
          </div>
        </div>

        <div class="card" style="overflow:hidden;">
          <div class="pad" style="border-bottom:1px solid var(--border);font-size:13.5px;font-weight:700;">Meal breakdown</div>
          ${dt.meals.map(meal => {
            const open = dd.openMeal === meal.id;
            return `
            <div style="border-bottom:1px solid var(--border);">
              <div class="accordion-head" style="padding:12px 18px;gap:14px;" onclick="App.setDesktopMeal('${meal.id}')">
                <div style="width:150px;flex-shrink:0;font-size:13px;font-weight:700;">${meal.name}</div>
                <div style="flex:1;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${meal.subtitle}</div>
                <div class="num" style="width:70px;flex-shrink:0;text-align:right;font-size:13px;font-weight:700;">${mealKcal(meal)} kcal</div>
                <div class="chev ${open?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              ${open ? `
                <div style="padding:0 18px 12px 164px;">
                  ${meal.items.map(item => `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px;">
                      <div style="color:var(--ink-2);">${item.name}</div>
                      <div style="display:flex;gap:14px;">
                        <div style="color:var(--muted);">P ${item.p}g · C ${item.c}g · F ${item.f}g</div>
                        <div class="num" style="font-weight:700;width:40px;text-align:right;">${item.kcal}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="d-aside">
        <div class="card pad" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div style="font-size:13px;font-weight:700;color:var(--ink-2);">Water</div>
            <div class="pill ${waterGood?'pill-good':'pill-warn'}">${waterGood?'In range':'Under'}</div>
          </div>
          <div class="num disp" style="font-size:22px;font-weight:800;">${waterL} L <span style="font-size:12px;font-weight:600;color:var(--ink-2);">of ${targetInfo('water').label}</span></div>
          <div style="height:8px;border-radius:5px;background:var(--border);margin-top:10px;overflow:hidden;">
            <div style="height:100%;width:${waterPct}%;border-radius:5px;background:var(--brand);"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button onclick="App.addWater(-250)" ${dt.waterMl<=0?'disabled':''} style="flex:1;text-align:center;padding:8px 0;border-radius:9px;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);font-family:inherit;opacity:${dt.waterMl<=0?'0.5':'1'};">− 250 ml</button>
            <button onclick="App.addWater(250)" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;background:var(--brand-tint);color:var(--brand-dark);font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">+ 250 ml</button>
            <button onclick="App.addWater(500)" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;background:var(--brand-tint);color:var(--brand-dark);font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;">+ 500 ml</button>
          </div>
        </div>

        <div style="font-size:13px;font-weight:700;margin-bottom:10px;">Memory · saved foods</div>
        <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:18px;">
          ${savedShortcuts.map(([name,kcal]) => `
            <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 12px;">
              <div style="font-size:12.5px;font-weight:600;">${name}</div>
              <div class="num" style="font-size:12px;color:var(--ink-2);font-weight:700;">${kcal}</div>
            </div>
          `).join('')}
        </div>

        <div style="background:var(--note-bg);border:1px solid var(--note-border);border-radius:14px;padding:14px;">
          <div style="font-size:12.5px;font-weight:800;margin-bottom:4px;">Bone ratio memory</div>
          <div style="font-size:11.5px;color:var(--ink-2);margin-bottom:8px;line-height:1.4;">Running average from weighed entries, kept up to date automatically.</div>
          <div class="num disp" style="font-size:22px;font-weight:800;color:var(--brand-dark);">22.6%</div>
          <div style="font-size:10.5px;color:var(--muted);">across 4 weighed entries</div>
        </div>
      </div>
    </div>
  `;
}

/* ================= BOOT ================= */
App.loadLocal();
App.checkDayRollover();
App.render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

// A standalone PWA can sit suspended in the background across midnight without
// being reloaded, so the boot-time rollover check above never re-runs on its own.
// Re-check whenever the app comes back to the foreground.
function recheckDayOnResume(){
  const before = App.state.dayLog.currentDate;
  App.checkDayRollover();
  if (App.state.dayLog.currentDate !== before) App.render();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') recheckDayOnResume();
});
window.addEventListener('pageshow', recheckDayOnResume);
window.addEventListener('focus', recheckDayOnResume);
</script>
</body>
</html>
